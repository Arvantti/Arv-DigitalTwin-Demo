schema_version: 2
constraints:
  critical_pressure_target:
    metric: critical_pressure_mca
    operator: ">="
    value_from_request: target_pressure_mca
    request_range_mca: [10.0, 45.0]
    unit: mca
  supply_level_range: { metric: supply_level_pct, min: 20, max: 95, unit: "%" }
  pump_discharge_min: { metric: pump_discharge_pressure_mca, operator: ">=", value: 70.0, unit: mca }
