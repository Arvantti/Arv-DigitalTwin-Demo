# Productos de la fábrica de cajas (docs/datos-reales.md): una caja por línea. Todas salen de lámina de doble pared BC
# (preset bc-2500 de la corrugadora), así que comparten la ruta de la corrugadora al carro de transferencia; desde el
# carril, cada una sigue su línea. Lista de materiales por caja: 3 capas de liner y 2 de medium (×1,4 por la onda) sobre
# el área de lámina, almidón, tinta y 1/25 de fleje (fajos de 25). Valores imaginarios.
# Tiempos (catálogo): corte = 60 ÷ (200 m/min ÷ 1,45 m × 3 a lo ancho × cajas por lámina), del preset bc-2500;
# lotes: pila de 600 láminas, fajo de 25 cajas y estiba del paletizador (24 o 40 fajos de 25).
