# Fábrica de cajas de cartón corrugado: gemelo del sistema de transporte (manejo de materiales).
# Planta ficticia de referencia (manufactura discreta con proceso continuo al inicio). Todos los valores
# son supuestos plausibles, no datos de una planta real. Ficha de diseño: docs/box-plant.md.
#
# Convenciones: iguales a plastic-injection-plant-v1/plant.yaml
#   - Metros, origen suroeste, x = este, y = norte, z = arriba.
#   - zones[].rect = [x_min, y_min, ancho_x, largo_y]
#   - equipment[].position = centro de la huella; footprint = [dx, dy, dz] antes de rotar
#
# El archivo se escribió con un generador para las filas repetidas (carriles, líneas, estanterías); se edita a mano.

schema_version: 0.1.0

plant:
  id: corrugated-box-plant-v1
  name: Fábrica de cajas de cartón corrugado (referencia)
  kind: discrete
  units: { length: m, angle: deg, mass: kg, time: s }
  frame: { origin: esquina suroeste, x: este, y: norte, z: arriba }
  site: { width_x: 230, length_y: 135 }
  context:
    location: Valle de Aburrá, Colombia (~1.500 m s. n. m.)
    shifts: 3 turnos, 24/6
    daily_output_t: 120
    corrugator: { width_m: 2.5, speed_m_min: 200, flutes: [B, C, BC] }
    converting_lines: 3
    box_sizes: ["grande 600 × 400 × 400 mm (línea 1)", "mediana 400 × 300 × 300 mm (línea 2)", "pequeña troquelada 250 × 200 × 150 mm (línea 3)"]
    assumptions:
      - "Tres tamaños de caja imaginarios, uno por línea. Lámina de referencia (caja mediana 400 × 300 × 300 mm): 1,45 × 0,62 m, 3 por ancho: ≈ 414 láminas/min."
      - "Pila de 1,4 m ≈ 200 capas × 3 = 600 láminas; sale una pila cada ≈ 1,45 min (≈ 41 pilas/h)."
      - "Transportadores de pilas de rodillos motorizados por zonas de 2,4 m a 0,3 m/s; carro de transferencia a 1 m/s."
      - "Fajos de 25 cajas; la línea 1 tiene paletizador propio y las líneas 2 y 3 comparten uno."

layout_concept: >
  La corrugadora cruza la franja norte de oeste a este: portabobinas y single
  facers junto a la bodega de bobinas, puente, engomadora, doble mesa,
  cortadoras y apilador. Las pilas de láminas salen por rodillos y dos mesas
  giratorias al carro de transferencia, que corre de norte a sur por el lado
  este y reparte entre los carriles de alimentación de las tres máquinas de
  conversión (una por tamaño de caja, al oeste del riel) y el pulmón de pilas
  (al este del riel). Las máquinas trabajan de este a oeste; los fajos viajan
  por banda hasta los paletizadores (uno para la línea 1, uno compartido por
  las líneas 2 y 3), y las estibas envueltas pasan en montacargas a la
  bodega de producto terminado del oeste, que despacha por los muelles del sur.
  Servicios (almidón, caldera, aire, subestación), recorte y almacén de
  troqueles quedan al norte de la corrugadora.

