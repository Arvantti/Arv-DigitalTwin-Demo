# Tamaño de la estiba por producto (planta de plásticos).
# La estiba es estándar (1,2 x 1,0 m, 1,6 m de altura de apilado); las piezas que caben dependen del producto.
# Procedimiento y reglas en docs/plant-engine.md; calculado con tools/logistics/pallet_sizing.py.
pallet:
  length_m: 1.2          # estiba estándar (supuesto)
  width_m: 1.0
  stack_height_m: 1.6
  packing_efficiency: 0.75   # fracción del volumen útil ocupada por las piezas (cajas y espacios), supuesto
  max_load_kg: 800            # carga máxima por estiba, supuesto
  round_down_to: 10           # el conteo se redondea hacia abajo a múltiplos de 10 (conteo de operario)
# Volumen que ocupa una pieza en la estiba (litros), ya considerando apilado o encaje. Todos son supuestos
# hasta tener los moldes reales. Las inyectoras con molde en el catálogo (catalog/setup.yaml)
# toman el volumen de su producto en catalog/products.yaml.
bulk_l:
  imm-20: 14.0    # caja organizadora 40 L
