scenarios:
  - id: nominal
    description: "Una hora de producción estable de las 29 inyectoras; las piezas de la imm-03 viajan por la banda de 88 m"
    duration_s: 3600
    expect:
      - { path: equipment.imm-03.variables.cycle_count, min: 295, max: 301, description: "(3.600 s ÷ 12 s = 300 ciclos)" }
      - { path: lines.lids-05l.output_units, min: 1040, max: 1130, description: "(299 ciclos × 4 cavidades = 1.196 piezas, menos ≈ 0,6 % de rechazo, menos ≈ 98 que siguen en la banda: 88 m ÷ 0,3 m/s = 293 s ≈ 24 ciclos × 4)" }
      - { path: equipment.imm-03.state_share.blocked, equals: 0.0, description: "(la banda recibe 4 piezas cada 12 s, bastante menos que lo que admite: 1 pieza cada 1,33 s)" }
      - { path: equipment.pack-station-01.variables.units_packed, min: 1040, max: 1130, description: "(todo lo que entrega la banda llega a la mesa de empaque y se cuenta; el operario cuenta a 120 u/min, muy por encima de las ≈ 18 u/min que llegan)" }
      - { path: equipment.pack-station-01.variables.boxes_count, equals: 4, description: "(≈ 1.092 piezas ÷ 250 por caja = 4,4 cajas)" }
      - { path: equipment.dryer-01.variables.resin_dry, equals: 1, description: "(el secador de ABS no tiene inyectora enlazada: solo se vigilan sus propias variables)" }
      - { path: equipment.dryer-01.variables.processed_kg, min: 149, max: 151, description: "(sin enlace entrega su caudal nominal: 150 kg/h × 1 h)" }
      - { path: equipment.dryer-04.variables.processed_kg, min: 268, max: 276, description: "(ahora entrega lo que pide la imm-28, no su caudal nominal: 7 kg × 1,03 = 7,21 kg por ciclo de 95 s = 273 kg/h × 1 h)" }
      - { path: equipment.dryer-03.variables.processed_kg, min: 23.5, max: 25.5, description: "(lo que pide la imm-01: 16 cavidades × 3,5 g × 1,10 de colada = 61,6 g cada 9 s = 24,6 kg/h × 1 h)" }
      - { path: equipment.extruder-pel-01.variables.processed_kg, min: 94, max: 102, description: "(todo el molido que entrega el molino llega a la línea de peletizado, que procesa 350 kg/h: ≈ 99 kg de los 100,6 kg/h que trituró, menos lo que el paso de retraso del motor aún no pasó)" }
      - { path: equipment.silo-05.variables.total_in_kg, min: 94, max: 102, description: "(el pellet que sale de la línea llega al silo 5)" }
      - { path: equipment.silo-05.variables.mass_kg, min: 6090, max: 6110, description: "(30 t × 20 % = 6.000 kg de inicio + ≈ 99 kg recibidos)" }
      - { path: equipment.imm-28.state_share.starved, equals: 0.0, description: "(el secador 4 entrega todo lo que pide la imm-28)" }
      - { path: equipment.chiller-01.variables.water_ok, equals: 1, description: "(el agua de moldes se mantiene dentro de la banda de 3 °C)" }
      - { path: equipment.chiller-01.variables.supply_temp_c, min: 11.2, max: 12.8, description: "(el chiller de 600 kW con 360 kW de carga mantiene 12 °C ± 0,5 °C por etapas)" }
      - { path: equipment.chiller-02.state, equals: "off", description: "(el chiller de respaldo está apagado)" }
      - { path: equipment.grinder-rec-01.variables.processed_kg, min: 95, max: 104, description: "(el molino recibe el scrap de las 29 inyectoras y lo tritura todo. Coladas: Σ (disparo − piezas) × ciclos/h = 79 kg/h; rechazos base: Σ 1 % (1,4 % si es reciclado) de la masa de piezas = 21,6 kg/h; total ≈ 100,6 kg/h)" }
      - { path: equipment.imm-28.variables.cycle_count, min: 36, max: 38, description: "(la inyectora más grande: 3.600 s ÷ 95 s ≈ 38 ciclos; el primero termina al cerrar el ciclo)" }

  - id: conveyor-trip
    description: "El motor de la banda principal se dispara 20 min: las piezas se acumulan en la entrada y la inyectora 3 se bloquea"
    duration_s: 3600
    timeline:
      - { at_s: 1800, equipment: conveyor-main-01, command: inject_fault, args: { fault: motor_trip, duration_s: 1200 } }
    expect:
      - { path: equipment.imm-03.state_share.blocked, min: 0.3, description: "(la zona de entrada guarda 8 piezas = 2 ciclos; después la inyectora espera ≈ 1.200 − 60 s de 3.600)" }
      - { path: events.conveyor-main-01.full, min: 1 }
      - { path: lines.lids-05l.output_units, min: 650, max: 760, description: "(≈ 596 piezas que entraron antes del paro llegan al final; después del paro entran ≈ 100 más en los 300 s que quedan, más las 8 de la entrada)" }
      - { path: equipment.pack-station-01.variables.units_packed, min: 650, max: 760, description: "(la estación solo cuenta lo que entrega la banda, igual que el KPI de la línea)" }
      - { path: equipment.pack-station-01.variables.boxes_count, min: 2, max: 3, description: "(≈ 700 piezas ÷ 250 por caja)" }
      - { path: equipment.imm-01.variables.cycle_count, min: 395, description: "(las demás inyectoras no se enteran: 3.600 s ÷ 9 s = 400 ciclos)" }

  - id: dryer-stop
    description: "El secador 4 se apaga a los 30 min: la imm-28 (HDPE reciclado, 273 kg/h) se queda sin resina seca y espera; las demás no se enteran"
    duration_s: 3600
    timeline:
      - { at_s: 1800, equipment: dryer-04, command: stop }
    expect:
      - { path: equipment.dryer-04.state, equals: "off" }
      - { path: equipment.imm-28.variables.cycle_count, min: 19, max: 21, description: "(1.800 s ÷ 95 s = 18,9: el ciclo 19 termina a los 1.805 s y la tolva de la máquina aguanta 10 s más, lo que alcanza para el ciclo 20)" }
      - { path: equipment.imm-28.state_share.starved, min: 0.40, max: 0.52, description: "(espera desde ≈ 1.900 s hasta el final: ≈ 1.700 s de 3.600 s = 0,47)" }
      - { path: equipment.imm-01.variables.cycle_count, min: 395, description: "(la imm-01 tiene su propio secador y sigue ciclando: 3.600 s ÷ 9 s = 400)" }
      - { path: equipment.dryer-03.variables.resin_dry, equals: 1 }

  - id: chiller-trip
    description: "El chiller 1 se dispara por alta presión a los 30 min durante 45 min: el agua de moldes sube, los moldes se calientan y el rechazo y el scrap aumentan"
    duration_s: 3600
    timeline:
      - { at_s: 1800, equipment: chiller-01, command: inject_fault, args: { fault: high_pressure_trip, duration_s: 2700 } }
    expect:
      - { path: equipment.chiller-01.variables.supply_temp_c, min: 18, max: 22, description: "(sin compresores el circuito sube 360 kW ÷ (4.186 kJ/m³K × 20 m³) = 0,0043 K/s: 12,5 °C + 1.800 s × 0,0043 ≈ 20 °C)" }
      - { path: equipment.chiller-01.variables.water_ok, equals: 0, description: "(pasó de 15 °C a los ≈ 2.500 s)" }
      - { path: equipment.imm-01.variables.mold_temp, min: 48, description: "(sin agua el molde busca la consigna + 25 °C = 55 °C con constante de 300 s, desde los ≈ 2.500 s)" }
      - { path: equipment.imm-01.variables.parts_rejected, min: 200, description: "(≈ 1.100 s con el molde caliente: ≈ 120 ciclos × 16 cavidades × ≈ 10 a 20 % de rechazo por rechupes y deformación; con agua son ≈ 65 en toda la hora)" }
      - { path: equipment.grinder-rec-01.variables.processed_kg, min: 140, description: "(el rechazo extra llega al molino: ≈ 100 kg en la hora nominal)" }
      - { path: equipment.dryer-04.variables.resin_dry, equals: 1, description: "(los secadores no dependen del chiller)" }

  - id: pelletizer-jam
    description: "La cortadora de la línea de peletizado se atasca a los 10 min durante 45 min: el pellet deja de llegar al silo 5 y el molido se acumula en la tolva de la extrusora; el molino y las inyectoras no se enteran"
    duration_s: 3600
    timeline:
      - { at_s: 600, equipment: extruder-pel-01, command: inject_fault, args: { fault: cutter_jam, duration_s: 2700 } }
    expect:
      - { path: equipment.extruder-pel-01.variables.hopper_level_pct, min: 25, max: 29.5, description: "(durante el atasco llegan ≈ 100,6 kg/h × 0,75 h = 75 kg; al arreglarlo, en los 300 s que quedan entran 8,4 kg y salen 350 kg/h × 300 s = 29,2 kg: ≈ 54 kg de 200 kg = 27 %)" }
      - { path: equipment.silo-05.variables.total_in_kg, min: 42, max: 49, description: "(≈ 99 kg que trituró el molino − 54 kg que siguen en la tolva = ≈ 45 kg)" }
      - { path: equipment.grinder-rec-01.variables.processed_kg, min: 95, max: 104, description: "(el molino sigue triturando todo lo que llega: la tolva de la extrusora no se llena)" }
      - { path: equipment.imm-01.variables.cycle_count, min: 395, description: "(las inyectoras no se enteran)" }
