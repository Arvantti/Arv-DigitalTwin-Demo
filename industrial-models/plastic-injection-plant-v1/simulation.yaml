scenarios:
  - id: nominal
    description: "Una hora de producción estable de las 12 inyectoras, con la celda de ensamble abastecida por montacargas"
    duration_s: 3600
    expect:
      - { path: equipment.dryer-01.variables.resin_dry, equals: 1, description: "(el secador de ABS no tiene inyectora enlazada: solo se vigilan sus propias variables)" }
      - { path: equipment.dryer-01.variables.processed_kg, min: 149, max: 151, description: "(sin enlace entrega su caudal nominal: 150 kg/h × 1 h)" }
      - { path: equipment.dryer-03.variables.processed_kg, min: 23.5, max: 25.5, description: "(lo que pide la imm-01: 16 cavidades × 3,5 g × 1,10 de colada = 61,6 g cada 9 s = 24,6 kg/h × 1 h)" }
      - { path: equipment.assembly-01.variables.units_assembled, min: 96, max: 98, description: "(las estibas de pedal/palanca y de cuerpos salen de las estanterías en t = 1 s, las carga el montacargas (45 s), salen por el corredor con 30 s de separación y llegan a los 148 y 169 s; con 5 s más para la primera pieza el operario arranca a los ≈ 174 s: (3.600 − 174) ÷ 35 = 97,9, o sea 97 unidades; la 98.ª terminaría a los 3.604 s)" }
      - { path: equipment.assembly-01.state_share.starved, min: 0.04, max: 0.06, description: "(espera la primera pieza de cada cubeta ≈ 174 s de 3.600 s = 0,048)" }
      - { path: equipment.pack-station-03.variables.units_packed, min: 95, max: 97, description: "(todo lo que arma la celda 1 llega a la mesa de empaque 3, con un paso de retraso)" }
      - { path: equipment.imm-06.state_share.blocked, equals: 0.0, description: "(el buffer de 7.200 piezas absorbe las 288 u/h de la imm-06: ya no se bloquea porque la celda use solo 103 u/h)" }
      - { path: equipment.buf-06.variables.loose_pieces, min: 276, max: 288, description: "(144 ciclos × 2 piezas = 288, menos ≈ 1 % de rechazo; todavía no completa la estiba de 7.200)" }
      - { path: equipment.buf-01.variables.pallets_delivered, equals: 0, description: "(la estiba de cubiertos es de 48.000 piezas: la imm-01 junta ≈ 6.300 por hora, la primera estiba tarda ≈ 7,6 h)" }
      - { path: equipment.fleet-01.variables.trips_completed, equals: 4, description: "(los 4 viajes de las estanterías a la celda, 2 por componente; ninguna estiba de buffer se llena en la hora)" }
      - { path: equipment.fleet-01.variables.vehicles_busy, max: 6 }
      - { path: equipment.dryer-04.variables.processed_kg, min: 72, max: 76, description: "(lo que pide la imm-19: 700 g × 1,06 de colada = 0,74 kg cada 35 s = 76 kg/h, menos el primer ciclo)" }
      - { path: equipment.imm-19.state_share.starved, equals: 0.0, description: "(el secador 4 entrega todo lo que pide la imm-19)" }
      - { path: equipment.extruder-pel-01.variables.processed_kg, min: 29, max: 32, description: "(todo el molido que entrega el molino llega a la línea de peletizado, que procesa 350 kg/h: ≈ 30,7 kg por hora)" }
      - { path: equipment.silo-05.variables.total_in_kg, min: 29, max: 32, description: "(el pellet que sale de la línea llega al silo 5)" }
      - { path: equipment.silo-05.variables.mass_kg, min: 6025, max: 6035, description: "(30 t × 20 % = 6.000 kg de inicio + ≈ 30,7 kg recibidos)" }
      - { path: equipment.chiller-01.variables.water_ok, equals: 1, description: "(el agua de moldes se mantiene dentro de la banda de 3 °C)" }
      - { path: equipment.chiller-01.variables.supply_temp_c, min: 11.2, max: 12.8, description: "(el chiller de 600 kW mantiene 12 °C ± 0,5 °C por etapas)" }
      - { path: equipment.chiller-02.state, equals: "off", description: "(el chiller de respaldo está apagado)" }
      - { path: equipment.grinder-rec-01.variables.processed_kg, min: 29, max: 32, description: "(el molino recibe el scrap de las 12 inyectoras (coladas y rechazos) y lo tritura todo: ≈ 30,7 kg/h)" }

  - id: dryer-stop
    description: "El secador 4 se apaga a los 30 min: la imm-19 (cuerpo de papelera en PP reciclado, 76 kg/h) se queda sin resina seca y espera; las demás no se enteran"
    duration_s: 3600
    timeline:
      - { at_s: 1800, equipment: dryer-04, command: stop }
    expect:
      - { path: equipment.dryer-04.state, equals: "off" }
      - { path: equipment.imm-19.variables.cycle_count, min: 51, max: 53, description: "(1.800 s ÷ 35 s = 51,4: con lo que guarda la tolva de la máquina alcanza a cerrar el ciclo 52)" }
      - { path: equipment.imm-19.state_share.starved, min: 0.45, max: 0.52, description: "(espera desde ≈ 1.820 s hasta el final: ≈ 1.780 s de 3.600 s = 0,49)" }
      - { path: equipment.imm-01.variables.cycle_count, min: 395, description: "(la imm-01 tiene su propio secador y sigue ciclando: 3.600 s ÷ 9 s = 400)" }
      - { path: equipment.dryer-03.variables.resin_dry, equals: 1 }

  - id: body-stop
    description: "La imm-19 (cuerpo de papelera) se apaga a los 30 min: su buffer deja de llenarse, pero la celda de ensamble 1 sigue con el inventario de la estantería y de la estiba en la línea (6 estibas de 240 cuerpos, ≈ 15 h de la celda 1)"
    duration_s: 3600
    timeline:
      - { at_s: 1800, equipment: imm-19, command: stop }
    expect:
      - { path: equipment.imm-19.state, equals: idle }
      - { path: equipment.buf-19.variables.loose_pieces, min: 50, max: 52, description: "(la imm-19 entrega 1 cuerpo cada 35 s hasta los 1.800 s: 1.800 ÷ 35 = 51 cuerpos, menos un posible rechazo)" }
      - { path: equipment.assembly-01.variables.units_assembled, min: 96, max: 98, description: "(el inventario de cuerpos cubre la hora: igual que en nominal)" }
      - { path: equipment.assembly-01.state, equals: running }
      - { path: equipment.assembly-01.state_share.starved, max: 0.06 }

  - id: fleet-short
    description: "La flota se reduce a 1 montacargas desde el inicio: las 4 estibas con que arranca la celda se sirven una por vez, esperan en cola y la celda arranca tarde"
    duration_s: 3600
    timeline:
      - { at_s: 0, equipment: fleet-01, command: set_param, args: { name: vehicles, value: 1 } }
    expect:
      - { path: equipment.fleet-01.variables.trips_completed, equals: 4, description: "(un montacargas hace los 4 viajes a la celda)" }
      - { path: equipment.assembly-01.variables.units_assembled, min: 92, max: 95, description: "(la celda arranca más tarde que con 6 montacargas: 93 unidades contra 97)" }
      - { path: equipment.fleet-01.variables.pallets_queued, equals: 0, description: "(a la hora ya no queda nadie en cola: con estibas por producto el pedido de viajes es bajo y un montacargas alcanza)" }
      - { path: events.fleet-01.fleet_saturated, min: 1 }

  - id: pallet-chain
    description: "Cuatro horas: la imm-19 junta 240 cuerpos de papelera (la estiba de ese producto), el buffer cierra la estiba (120 s), un montacargas la lleva a la estantería 2 y esta recibe sus 240 piezas"
    duration_s: 14400
    expect:
      - { path: equipment.buf-19.variables.pallets_delivered, equals: 1, description: "(1 cuerpo cada 35 s × 0,99 de rechazo: 240 piezas a los ≈ 8.470 s; sale a los ≈ 8.590 s)" }
      - { path: equipment.buf-06.variables.pallets_delivered, equals: 0, description: "(la estiba de pedal y palanca es de 7.200 piezas: a 285 u/h tardaría ≈ 25 h)" }
      - { path: equipment.rack-sf-02.variables.units_received, equals: 240, description: "(la estiba llega a los ≈ 8.590 + 45 + 47 + 45 = 8.727 s)" }
      - { path: equipment.rack-sf-02.variables.stored_pallets, equals: 4, description: "(6 de inventario inicial, 3 pasaron a la celda: 2 al arrancar y una a los ≈ 6.440 s cuando se gastaron, +1 recibida)" }
      - { path: equipment.imm-06.state_share.blocked, equals: 0.0 }

  - id: chiller-trip
    description: "El chiller 1 se dispara por alta presión a los 30 min durante 45 min: el agua de moldes sube, los moldes se calientan y el rechazo y el scrap aumentan"
    duration_s: 3600
    timeline:
      - { at_s: 1800, equipment: chiller-01, command: inject_fault, args: { fault: high_pressure_trip, duration_s: 2700 } }
    expect:
      - { path: equipment.chiller-01.variables.supply_temp_c, min: 18, max: 22, description: "(sin compresores el circuito sube 360 kW ÷ (4.186 kJ/m³K × 20 m³) = 0,0043 K/s: 12,5 °C + 1.800 s × 0,0043 ≈ 20 °C)" }
      - { path: equipment.chiller-01.variables.water_ok, equals: 0, description: "(pasó de 15 °C a los ≈ 2.500 s)" }
      - { path: equipment.imm-01.variables.mold_temp, min: 48, description: "(sin agua el molde busca la consigna + 25 °C = 55 °C con constante de 300 s, desde los ≈ 2.500 s)" }
      - { path: equipment.imm-01.variables.parts_rejected, min: 200, description: "(≈ 1.100 s con el molde caliente: ≈ 120 ciclos × 16 cavidades × ≈ 10 a 20 % de rechazo por rechupes y deformación; con agua son ≈ 65 en toda la hora)" }
      - { path: equipment.grinder-rec-01.variables.processed_kg, min: 50, description: "(el rechazo extra llega al molino: ≈ 31 kg en la hora nominal)" }
      - { path: equipment.dryer-04.variables.resin_dry, equals: 1, description: "(los secadores no dependen del chiller)" }

  - id: pelletizer-jam
    description: "La cortadora de la línea de peletizado se atasca a los 30 min y sigue atascada al final de la hora: el pellet deja de llegar al silo 5 y el molido se acumula en la tolva de la extrusora; el molino y las inyectoras no se enteran"
    duration_s: 3600
    timeline:
      - { at_s: 1800, equipment: extruder-pel-01, command: inject_fault, args: { fault: cutter_jam, duration_s: 2700 } }
    expect:
      - { path: equipment.extruder-pel-01.variables.hopper_level_pct, min: 6.5, max: 8.5, description: "(durante la media hora de atasco llegan ≈ 30,7 kg/h × 0,5 h = 15,4 kg de 200 kg = 7,7 %)" }
      - { path: equipment.silo-05.variables.total_in_kg, min: 14, max: 17, description: "(≈ 30,7 kg que trituró el molino − 15,4 kg que siguen en la tolva = ≈ 15,3 kg)" }
      - { path: equipment.grinder-rec-01.variables.processed_kg, min: 29, max: 32, description: "(el molino sigue triturando todo lo que llega: la tolva de la extrusora no se llena)" }
      - { path: equipment.imm-01.variables.cycle_count, min: 395, description: "(las inyectoras no se enteran)" }
