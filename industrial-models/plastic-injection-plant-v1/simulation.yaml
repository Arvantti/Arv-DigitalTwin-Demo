# Simulación de la planta de inyección con el motor de planta (docs/plant-engine.md).
# Las 12 inyectoras de la nave (planta simplificada para la demo, 2026-11-01: solo las de los 4 productos del
# catálogo y la IMM-20 de reserva) se simulan con los parámetros del plant.yaml y del molde montado; el preset solo
# aporta lo que el plano no dice (zonas del cilindro, temperatura del molde), elegido por el tonelaje. Sus piezas
# van a un buffer de estibas y de ahí en montacargas. También se simulan los 4 secadores de resina, los 2 chillers
# (el segundo de respaldo, apagado), el molino de reciclaje y las 4 estaciones de empaque.
#
# Cascada de materiales y servicios (docs/plant-engine.md, sección 3):
#  - resina seca: el secador 3 (PS) alimenta a la imm-01 y el secador 4 (PP/HDPE reciclado) a la imm-19. Cada salida
#    de resina atiende a un solo destino (el motor no reparte caudal); los secadores 1 y 2 son de ABS y ninguna
#    inyectora del plano moldea ABS, y la imm-02 (también PS) queda con la resina por defecto;
#  - agua de moldes: el chiller 1 alimenta a las 12 inyectoras; el chiller 2 es de respaldo y no está enlazado;
#  - scrap: las 12 inyectoras entregan rechazos y coladas al molino de reciclaje (pasando por la clasificación y el
#    lavado, que no se simulan);
#  - reciclaje: el molino entrega el molido a la línea de peletizado (extruder-pel-01) y esta el pellet al silo 5 de
#    reciclado (por la estación de big-bag, que no se simula). Del silo 5 al manifold y a las inyectoras (la mezcla
#    de pellet reciclado en la resina) aún no hay enlace: el silo solo acumula.

schema_version: 0.1.0
description: Nave de inyección (12 inyectoras), buffers de estibas, montacargas y celda de ensamble
dt: 1.0

