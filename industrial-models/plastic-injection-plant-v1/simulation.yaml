scenarios:
  - id: nominal
    description: "Una hora de producción estable de las 29 inyectoras; las piezas de la imm-03 viajan por la banda de 88 m"
    duration_s: 3600
    expect:
      - { path: equipment.imm-03.variables.cycle_count, min: 295, max: 301, description: "(3.600 s ÷ 12 s = 300 ciclos)" }
      - { path: lines.lids-05l.output_units, min: 1040, max: 1130, description: "(299 ciclos × 4 cavidades = 1.196 piezas, menos ≈ 0,6 % de rechazo, menos ≈ 98 que siguen en la banda: 88 m ÷ 0,3 m/s = 293 s ≈ 24 ciclos × 4)" }
      - { path: equipment.imm-03.state_share.blocked, equals: 0.0, description: "(la banda recibe 4 piezas cada 12 s, bastante menos que lo que admite: 1 pieza cada 1,33 s)" }
      - { path: equipment.imm-28.variables.cycle_count, min: 36, max: 38, description: "(la inyectora más grande: 3.600 s ÷ 95 s ≈ 38 ciclos; el primero termina al cerrar el ciclo)" }

  - id: conveyor-trip
    description: "El motor de la banda principal se dispara 20 min: las piezas se acumulan en la entrada y la inyectora 3 se bloquea"
    duration_s: 3600
    timeline:
      - { at_s: 1800, equipment: conveyor-main-01, command: inject_fault, args: { fault: motor_trip, duration_s: 1200 } }
    expect:
      - { path: equipment.imm-03.state_share.blocked, min: 0.3, description: "(la zona de entrada guarda 8 piezas = 2 ciclos; después la inyectora espera ≈ 1.200 − 60 s de 3.600)" }
      - { path: events.conveyor-main-01.full, min: 1 }
      - { path: lines.lids-05l.output_units, min: 650, max: 760, description: "(≈ 596 piezas que entraron antes del paro llegan al final; después del paro entran ≈ 100 más en los 300 s que quedan, más las 8 de la entrada)" }
      - { path: equipment.imm-01.variables.cycle_count, min: 395, description: "(las demás inyectoras no se enteran: 3.600 s ÷ 9 s = 400 ciclos)" }
