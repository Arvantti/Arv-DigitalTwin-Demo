# Simulación de la planta de inyección con el motor de planta (docs/plant-engine.md).
# Las 29 inyectoras de la nave se simulan con los parámetros del plant.yaml (tonelaje, cavidades, peso de la pieza,
# ciclo y robot); el preset solo aporta lo que el plano no dice (zonas del cilindro, temperatura del molde),
# elegido por el tonelaje. La banda principal (88 m) recibe las piezas de la inyectora 3 y las lleva a la
# estación de empaque 1, que aún no tiene tipo en la librería. Las demás inyectoras trabajan solas: sus piezas
# se retiran a mano o con montacargas (flujos del plano sin enlace de banda).

