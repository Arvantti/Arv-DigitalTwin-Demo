# Simulación de la planta de inyección con el motor de planta (docs/plant-engine.md).
# Las 29 inyectoras de la nave se simulan con los parámetros del plant.yaml (tonelaje, cavidades, peso de la pieza,
# ciclo y robot); el preset solo aporta lo que el plano no dice (zonas del cilindro, temperatura del molde),
# elegido por el tonelaje. La banda principal (88 m) recibe las piezas de la inyectora 3 y las lleva a la
# estación de empaque 1. Las demás inyectoras trabajan solas: sus piezas se retiran a mano o con montacargas
# (flujos del plano sin enlace de banda). También se simulan los 4 secadores de resina, los 2 chillers (el
# segundo de respaldo, apagado), el molino de reciclaje y las otras 3 estaciones de empaque (sin banda: se
# alimentan a mano, sin llegadas).
#
# Cascada de materiales y servicios (docs/plant-engine.md, sección 3):
#  - resina seca: el secador 3 (PS) alimenta a la imm-01 y el secador 4 (PP/HDPE reciclado) a la imm-28. Cada salida
#    de resina atiende a un solo destino (el motor no reparte caudal); los secadores 1 y 2 son de ABS y ninguna
#    inyectora del plano moldea ABS, y la imm-02 (también PS) queda con la resina por defecto;
#  - agua de moldes: el chiller 1 alimenta a las 29 inyectoras; el chiller 2 es de respaldo y no está enlazado;
#  - scrap: las 29 inyectoras entregan rechazos y coladas al molino de reciclaje (pasando por la clasificación y el
#    lavado, que no se simulan);
#  - reciclaje: el molino entrega el molido a la línea de peletizado (extruder-pel-01) y esta el pellet al silo 5 de
#    reciclado (por la estación de big-bag, que no se simula). Del silo 5 al manifold y a las inyectoras (la mezcla
#    de pellet reciclado en la resina) aún no hay enlace: el silo solo acumula.

