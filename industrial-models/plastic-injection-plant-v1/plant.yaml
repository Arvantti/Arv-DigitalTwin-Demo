# Planta de inyección de artículos plásticos para hogar e industria.
# Planta ficticia de referencia (manufactura discreta). Valores marcados
# como "assumption" son estimaciones plausibles, no datos de una planta real.
#
# Convenciones:
#   - Coordenadas en metros. Origen en la esquina suroeste del predio.
#   - x = este, y = norte, z = arriba.
#   - zones[].rect = [x_min, y_min, ancho_x, largo_y]
#   - equipment[].position = centro de la huella [x, y, z_base]
#   - equipment[].footprint = [dx, dy, dz] antes de rotar (rotación en múltiplos de 90°)
#   - overhead: true -> equipo elevado (puente grúa); no se valida solape en planta.

schema_version: 0.1.0

plant:
  id: plastic-injection-plant-v1
  name: Planta de inyección de plásticos (referencia)
  kind: discrete
  units: { length: m, angle: deg, mass: kg, time: s }
  frame: { origin: esquina suroeste, x: este, y: norte, z: arriba }
  site: { width_x: 200, length_y: 110 }
  context:
    location: Valle de Aburrá, Colombia (~1.500 m s. n. m., ~24 °C)
    shifts: 3 turnos, 24/6
    daily_output_t: 22
    injection_machines: 29
    shot_weight_range_kg: [0.014, 7.0]
    recycled_resin_share: 0.60
    materials: [PP, HDPE, PS, ABS]
    assumptions:
      - Utilización media del parque de inyectoras ~45 % (mezcla de productos, cambios de molde, paradas).
      - Capacidad teórica al 100 % ≈ 55 t/día; real ≈ 22 t/día.
      - Termorregulador de molde y molino al pie se modelan como parámetros de cada inyectora.

layout_concept: >
  Flujo lineal oeste → este. Materia prima y silos al oeste; central de
  materiales (secado, mezcla y transporte neumático) contigua a la nave;
  nave de inyección al centro con tres bahías por tonelaje (pequeñas al
  sur, medianas al centro, grandes al norte bajo puente grúa); operaciones
  secundarias, empaque y bodega de producto terminado al este, con muelles
  de despacho. Reciclaje, taller y almacén de moldes, laboratorio y
  mantenimiento en la franja sur; servicios (subestación, aire, frío) en la
  franja norte, fuera de la nave. El scrap y las barreduras regresan por la
  franja sur al reciclaje, que alimenta los silos de material reciclado.

