  - { id: fk-recolecta-este-norte, name: "Recolección de producto terminado de la nave (cubiertos y baldes)", kind: forklift, from: nave-inyeccion, to: fleet-01, load: piezas inyectadas en cajas y estibas, width: 1.5, trips_per_h: 4, fleet: fleet-01, fleet_route: 5, path: [[36, 49], [79, 49], [79, 68.1], [85, 68.1]] }
  # --- Montacargas: de las estanterías de semielaborado a las celdas de ensamble ---
