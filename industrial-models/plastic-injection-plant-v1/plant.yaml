# Rutas de montacargas y de operarios (supuestos de recorrido, no de ingeniería de detalle). Cada ruta es una polilínea en metros:
#   - kind forklift: va por los pasillos de `aisles` (kind forklift) y no cruza equipos de piso, ni la banda principal (el semielaborado
#     se almacena al norte de la nave, del lado de las inyectoras, para que ningún montacargas pase bajo la banda). Ida y regreso van por
#     carriles distintos (mano derecha) en la escena;
#   - kind pedestrian: camina por donde no hay equipos de piso (rondas del operador y trayectos a las celdas de ensamble);
#   - from / to: un equipo (la ruta termina a ≤ 3,5 m de su huella) o una zona (la ruta empieza o termina dentro de ella);
#   - trips_per_h: viajes por hora de un vehículo (supuesto); walkers: operarios que la recorren (supuesto).
routes:
