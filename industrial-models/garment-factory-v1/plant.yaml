    location: Colombia (referencia ficticia)
    shifts: 1 turno de 8 h
    products: [camiseta-polo, camiseta-oversize]
    sewing_modules: 3
    sewing_operators: 15
    assumptions: ["Diseño conceptual; tiempos y capacidades estimados, requieren validación en planta."]
