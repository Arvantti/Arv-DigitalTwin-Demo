# Demanda de la demo (fase E de docs/datos-reales.md, decisión D75). twin_runtime.planning genera con esto los
# pedidos de cualquier fecha: la semilla es (planta, fecha de entrega), así que el pedido del 5 de noviembre es el
# mismo hoy y mañana, y la ventana de hoy a +30 días siempre tiene pedidos sin mantener ningún archivo.
#
# Capacidad: 22 t/día en 2 turnos de 8 h, de lunes a sábado (plant.yaml), con el reparto aprobado por el autor:
# 40 % caliente, 45 % frío y 15 % mostaza. `daily` es la capacidad diaria de cada SKU en sachets:
# 22.000 kg × participación ÷ kg de granel por sachet (lista de materiales de products.yaml). Por ejemplo,
# tomate 1.000 ml: 22.000 × 25 % ÷ 1,12 = 4.911 sachets/día. Los pedidos llenan load_pct de esa capacidad.
# Todo es supuesto: clientes ficticios, tamaños de pedido y tiempos de entrega.
demand:
  load_pct: 85
  timezone: "-05:00"            # hora de Colombia
  workdays: [1, 2, 3, 4, 5, 6]  # ISO: lunes = 1 … sábado = 6; el domingo la planta para
  shifts:
    - { name: Turno 1, start: "06:00", end: "14:00" }
    - { name: Turno 2, start: "14:00", end: "22:00" }
  lead_days: [4, 15]            # días entre la llegada del pedido y su entrega
  rush: { share_pct: 15, lead_days: [1, 3] }
  # Pedidos que salen tarde a propósito (regla del autor: algunos atrasados y otros a tiempo, al azar): el insumo
  # llega entre 3 h antes y 16 h después de la entrega, y la orden no puede empezar antes.
  late: { share_pct: 8, hold_hours: [-3, 16], materials: [laminado, pasta-tomate-30brix, aceite, huevo-liquido, harina-mostaza, caja-corrugada] }
  downtime: { per_day_pct: 4, hours: [1, 4], reasons: [falla mecánica, mantenimiento correctivo, falta de operario] }
  color_change_min: 0
  customers: [Distribuidora Norte, Autoservicio La Montaña, Cadena Surtimax del Valle, Comidas Rápidas El Parque, Casino Institucional Andino, Tiendas Barrio Unido, Exportadora Pacífico]
  products:
    - { product: tomate-1000,   daily: 4911,  order_qty: [1600, 6000],  round: 4 }
    - { product: tomate-250,    daily: 11786, order_qty: [4000, 16000], round: 16 }
    - { product: mayonesa-1000, daily: 4731,  order_qty: [1600, 6000],  round: 4 }
    - { product: mayonesa-500,  daily: 7097,  order_qty: [2400, 9600],  round: 8 }
    - { product: mayonesa-250,  daily: 9462,  order_qty: [3200, 12800], round: 16 }
    - { product: mostaza-250,   daily: 12571, order_qty: [4000, 16000], round: 16 }
