# Productos de la planta de salsas (docs/datos-reales.md): SKU = receta × presentación. Tres semielaborados a granel
# (uno por familia, con su receta) y seis SKU en sachet, los que corren hoy en los escenarios de simulation.yaml.
# Cada SKU usa su granel en kg por sachet (presentación × densidad de la llenadora), laminado y 1/n de caja.
# Las llenadoras que admiten otro formato (500 y 1.000 ml) aparecen como alternativas; la activa es la que tiene
# el formato montado (setup.yaml). Salsa BBQ y salsa rosada quedan para cuando tengan receta. Datos supuestos.
products:
- id: salsa-tomate
  name: Salsa de tomate pasteurizada
  family: caliente
  kind: semi
  unit: kg
  color: '#c62828'
  routing:
  - stage: pesaje
    equipment: [scale-01]
  - stage: cocción
    equipment: [kettle-01, kettle-02, kettle-03]
    tooling: rcp-tomato-sauce
  - stage: pasteurización
    equipment: [pasteurizer-01, pasteurizer-02]
  - stage: pulmón caliente
    equipment: [buffer-hot-01, buffer-hot-02]
  assumed: true
- id: mayonesa
  name: Mayonesa a granel
  family: frío
  kind: semi
  unit: kg
  color: '#f4c430'
  routing:
  - stage: fase acuosa
    equipment: [tank-aqueous-01]
  - stage: emulsión
    equipment: [emulsifier-01]
    tooling: rcp-mayo-natural
  - stage: molienda
    equipment: [colloid-mill-01]
  - stage: pulmón frío
    equipment: [buffer-cold-01]
  assumed: true
- id: mostaza-granel
  name: Mostaza a granel
  family: mostaza
  kind: semi
  unit: kg
  color: '#e0a800'
  routing:
