  - { id: lab-bench-01,     type: lab_bench, zone: laboratorio,   position: [40, 63, 0], footprint: [8, 1, 1],   params: { tests: [Brix, pH, acidez, consistómetro Bostwick, viscosidad, estabilidad de emulsión, microbiología] } }
  - { id: workbench-mnt-01, type: workbench, zone: mantenimiento, position: [81, 65, 0], footprint: [6, 1.5, 1], params: {} }

  # --- Servicios ---
  - { id: boiler-01,      type: fire_tube_boiler, zone: caldera,          position: [35, 5, 0],   footprint: [5, 2.2, 2.5], params: { rating_bhp: 60, steam_kg_h: 940, pressure_bar: 8, fuel: gas natural }, tags: [steam_pressure, water_level, firing_rate] }
  - { id: compressor-01,  type: air_compressor,   zone: compresores,      position: [43, 3, 0],   footprint: [1.5, 1.2, 1.6], params: { power_kw: 22, pressure_bar: 7 }, tags: [pressure] }
  - { id: compressor-02,  type: air_compressor,   zone: compresores,      position: [43, 7, 0],   footprint: [1.5, 1.2, 1.6], params: { power_kw: 22, pressure_bar: 7, role: respaldo }, tags: [pressure] }
  - { id: softener-01,    type: water_softener,   zone: tratamiento-agua, position: [50, 3, 0],   footprint: [2, 1, 2],     params: { flow_m3_h: 5 } }
  - { id: ro-01,          type: reverse_osmosis,  zone: tratamiento-agua, position: [50, 6, 0],   footprint: [3, 1, 2],     params: { flow_m3_h: 3 } }
  - { id: tank-water-01,  type: storage_tank,     zone: tratamiento-agua, position: [52.5, 2.5, 0], footprint: [2.2, 2.2, 3], params: { volume_l: 10000, content: agua tratada } , tags: [level] }
  - { id: chiller-01,     type: chiller,          zone: frio,             position: [58, 3, 0],   footprint: [4, 2, 2],     params: { capacity_kw: 150, supply_c: 4 }, tags: [supply_temperature] }
  - { id: ice-bank-01,    type: ice_bank,         zone: frio,             position: [58, 7, 0],   footprint: [4, 2, 2],     params: { storage_kwh: 600 }, tags: [ice_thickness] }
  - { id: transformer-01, type: transformer,      zone: subestacion,      position: [65, 5, 0],   footprint: [3, 2.5, 2.5], params: { rating_kva: 630 } }
  - { id: wwtp-01,        type: wastewater_plant, zone: ptar,             position: [93, 5, 0],   footprint: [10, 5, 3],    params: { flow_m3_d: 60, process: DAF + biológico } }

  # --- Sala de control del PLC ---
  # Puestos de la sala. Solo dibujan lo que publica la simulación: el PLC y el panel no calculan nada.
  # panel.slots: cada espacio del panel de gráficos lee una variable de un equipo simulado (equipment + variable);
  # con equipment: null queda libre, listo para asignarlo. Los gráficos definitivos se eligen después.
  - { id: plc-01,         type: plc_cabinet,   zone: sala-control, position: [70.5, 1.2, 0], footprint: [2.4, 0.7, 2.1], rotation_deg: 180, params: { rack: "CPU + 4 módulos de E/S + fuente", network: "Ethernet industrial hacia las celdas" } }
  - { id: operator-desk-01, type: operator_desk, zone: sala-control, position: [75, 5.5, 0], footprint: [3.2, 1.2, 1.1], params: { monitors: 2 } }
  - id: scada-wall-01
    type: control_panel
    zone: sala-control
    position: [75, 9.6, 0]
    footprint: [8, 0.3, 2.6]
    params: {}
    panel:
      title: Panel de planta
      slots:
        - { title: Presión de vapor,       equipment: boiler-01,        variable: pressure_bar,  unit: bar }
        - { title: Temperatura marmita 1,  equipment: kettle-01,        variable: temperature_c, unit: "°C" }
        - { title: Salida pasteurizador,   equipment: pasteurizer-01,   variable: product_out_c, unit: "°C" }
        - { title: Nivel pulmón caliente,  equipment: buffer-hot-01,    variable: level_pct,     unit: "%" }
        - { title: Velocidad sachetadora,  equipment: filler-pouch-01,  variable: speed_upm,     unit: "u/min" }
        - { title: "Peso medio, 1.000 ml", equipment: checkweigher-01,  variable: mean_g,        unit: g }
        - { title: Libre 1,                equipment: null,             variable: null }
        - { title: Libre 2,                equipment: null,             variable: null }

lines:
  - { id: line-hot,      name: Salsas en caliente,   mode: batch,      equipment: [pump-paste-01, kettle-01, kettle-02] }
  - { id: line-past,     name: Pasteurización,       mode: continuous, equipment: [pump-hot-01, pasteurizer-01, holding-tube-01, buffer-hot-01, buffer-hot-02] }
  - { id: line-emulsion, name: Emulsiones en frío,   mode: batch,      equipment: [tank-aqueous-01, oil-dosing-01, emulsifier-01, colloid-mill-01, buffer-cold-01, buffer-cold-02] }
  - { id: line-mustard,  name: Mostaza,              mode: batch,      equipment: [tank-mustard-01, mustard-mill-01, buffer-mustard-01] }
  - { id: line-250,  name: Envasado en sachet de 250 ml,   mode: discrete, equipment: [filler-sachet-01, filler-sachet-02, filler-sachet-03, checkweigher-02, case-pack-01] }
  - { id: line-500-1000, name: Envasado en sachet de 500 y 1.000 ml, mode: discrete, equipment: [filler-pouch-01, filler-pouch-02, filler-pouch-03, checkweigher-01, case-pack-02] }
  - { id: line-cooling, name: Enfriamiento de sachets llenados en caliente, mode: continuous, equipment: [cooling-tunnel-01] }

recipes:
  - id: rcp-mayo-natural
    product: Mayonesa natural
    line: line-emulsion
    batch_kg: 1500
    formula_pct: { aceite: 78.0, huevo_liquido: 8.0, agua: 7.0, vinagre: 4.0, azucar: 1.5, sal: 0.8, mostaza: 0.5, estabilizantes_conservantes: 0.2 }
    phases:
      - { name: cargar_fase_acuosa, equipment: tank-aqueous-01, duration_min: 10, setpoints: { temperature_c_max: 15, agitator_rpm: 300 } }
      - { name: transferir_a_emulsificador, equipment: emulsifier-01, duration_min: 4, setpoints: {} }
      - { name: hacer_vacio, equipment: emulsifier-01, duration_min: 5, setpoints: { vacuum_bar: -0.8 } }
      - { name: dosificar_aceite, equipment: oil-dosing-01, duration_min: 15, setpoints: { oil_flow_kg_h: 4700, rotor_rpm: 3000 } }
      - { name: dosificar_vinagre, equipment: emulsifier-01, duration_min: 3, setpoints: { rotor_rpm: 2000 } }
      - { name: homogeneizar, equipment: emulsifier-01, duration_min: 5, setpoints: { rotor_rpm: 3000, temperature_c_max: 18 } }
      - { name: moler_y_transferir, equipment: colloid-mill-01, duration_min: 20, setpoints: { flow_kg_h: 4500, gap_mm: 0.3 } }
      - { name: muestrear, equipment: lab-bench-01, duration_min: 10, setpoints: { ph_max: 4.1, viscosity_cp_min: 40000 } }
    yield_pct: 98.5

  - id: rcp-tomato-sauce
    product: Salsa de tomate
    line: line-hot
    batch_kg: 2000
    formula_pct: { pasta_tomate_30brix: 35.0, agua: 43.0, azucar: 15.0, vinagre: 4.0, sal: 1.8, almidon_modificado: 1.0, especias: 0.1, conservante: 0.1 }
    phases:
      - { name: cargar_agua, equipment: kettle-01, duration_min: 8, setpoints: { water_kg: 860 } }
      - { name: dosificar_pasta, equipment: pump-paste-01, duration_min: 15, setpoints: { paste_kg: 700, agitator_rpm: 40 } }
      - { name: dosificar_secos, equipment: kettle-01, duration_min: 10, setpoints: { agitator_rpm: 60 } }
      - { name: calentar, equipment: kettle-01, duration_min: 25, setpoints: { temperature_c: 85, steam_bar: 3 } }
      - { name: mantener, equipment: kettle-01, duration_min: 10, setpoints: { temperature_c: 85 } }
      - { name: muestrear, equipment: lab-bench-01, duration_min: 10, setpoints: { brix: [24, 28], ph_max: 3.9, bostwick_cm_30s: [4, 7] } }
      - { name: ajustar, equipment: kettle-01, duration_min: 5, optional: true, setpoints: {} }
      - { name: pasteurizar_y_transferir, equipment: pasteurizer-01, duration_min: 40, setpoints: { flow_l_h: 3000, product_out_c: 95, hold_c_min: 92, hold_s: 30 } }
    yield_pct: 98.0

  - id: rcp-mustard
    product: Mostaza
    line: line-mustard
    batch_kg: 1000
    formula_pct: { agua: 71.0, harina_mostaza: 12.0, vinagre: 12.0, sal: 2.5, azucar: 2.0, curcuma: 0.3, especias: 0.2 }
    phases:
      - { name: cargar_liquidos, equipment: tank-mustard-01, duration_min: 8, setpoints: {} }
      - { name: dispersar_harina, equipment: tank-mustard-01, duration_min: 15, setpoints: { agitator_rpm: 1500 } }
      - { name: hidratar, equipment: tank-mustard-01, duration_min: 60, setpoints: { agitator_rpm: 100 } }
      - { name: moler_y_transferir, equipment: mustard-mill-01, duration_min: 30, setpoints: { flow_kg_h: 1000 } }
      - { name: muestrear, equipment: lab-bench-01, duration_min: 10, setpoints: { ph_max: 3.8 } }
    yield_pct: 98.5

flows:
  # Recepción y almacenamiento
  - { from: pump-unload-01,   to: tank-oil-01,       medium: aceite,            rate: 20000, unit: L/h, piped: true }
  - { from: rack-paste-01,    to: drum-tipper-01,    medium: pasta de tomate,   rate: 4,     unit: bolsas/batch, show: true }
  - { from: rack-egg-01,      to: scale-01,          medium: huevo líquido,     rate: 120,   unit: kg/batch, show: true }
  - { from: rack-dry-01,      to: scale-01,          medium: ingredientes secos, rate: 350,  unit: kg/batch, show: true }
  - { from: rack-allergen-01, to: scale-allergen-01, medium: harina de mostaza, rate: 120,   unit: kg/batch }
  # Proceso en caliente
  - { from: drum-tipper-01,   to: pump-paste-01,     medium: pasta de tomate,   rate: 3000,  unit: kg/h, piped: true }
  - { from: pump-paste-01,    to: kettle-01,         medium: pasta de tomate,   rate: 3000,  unit: kg/h, piped: true, show: true }
  - { from: scale-01,         to: kettle-01,         medium: ingredientes pesados, rate: 340, unit: kg/batch, piped: false, show: true }
  - { from: kettle-01,        to: pump-hot-01,       medium: salsa cocida,      rate: 3000,  unit: L/h, piped: true }
  - { from: kettle-02,        to: pump-hot-01,       medium: salsa cocida,      rate: 3000,  unit: L/h, piped: true }
  - { from: pump-hot-01,      to: pasteurizer-01,    medium: salsa cocida,      rate: 3000,  unit: L/h, piped: true, show: true }
  - { from: pasteurizer-01,   to: holding-tube-01,   medium: salsa,             rate: 3000,  unit: L/h, piped: true }
  - { from: holding-tube-01,  to: buffer-hot-01,     medium: salsa pasteurizada, rate: 3000, unit: L/h, piped: true, show: true }
  - { from: holding-tube-01,  to: kettle-01,         medium: desvío por baja temperatura, rate: 3000, unit: L/h, piped: true, note: solo en desvío }
  - { from: holding-tube-01,  to: kettle-02,         medium: desvío por baja temperatura, rate: 3000, unit: L/h, piped: true, note: solo en desvío }
  # Proceso en frío
  - { from: scale-01,         to: tank-aqueous-01,   medium: fase acuosa,       rate: 300,   unit: kg/batch, piped: false, show: true }
  - { from: tank-oil-01,      to: oil-dosing-01,     medium: aceite,            rate: 4700,  unit: kg/h, piped: true, show: true }
  - { from: oil-dosing-01,    to: emulsifier-01,     medium: aceite,            rate: 4700,  unit: kg/h, piped: true }
  - { from: tank-vinegar-01,  to: emulsifier-01,     medium: vinagre,           rate: 60,    unit: kg/batch, piped: true }
  - { from: tank-aqueous-01,  to: emulsifier-01,     medium: fase acuosa,       rate: 300,   unit: kg/batch, piped: true }
  - { from: emulsifier-01,    to: colloid-mill-01,   medium: pre-emulsión,      rate: 4500,  unit: kg/h, piped: true }
  - { from: colloid-mill-01,  to: buffer-cold-01,    medium: mayonesa,          rate: 4500,  unit: kg/h, piped: true, show: true }
  - { from: scale-allergen-01, to: tank-mustard-01,  medium: harina de mostaza, rate: 120,   unit: kg/batch, piped: false, show: true }
  - { from: tank-mustard-01,  to: mustard-mill-01,   medium: mostaza,           rate: 1000,  unit: kg/h, piped: true }
  - { from: mustard-mill-01,  to: buffer-mustard-01, medium: mostaza,           rate: 1000,  unit: kg/h, piped: true, show: true }
  # Llenado
  # Caliente: 30 × 1,12 kg + 80 × 0,28 kg = 56 kg/min ≈ 3.000 L/h, igual a la capacidad del pasteurizador.
  - { from: buffer-hot-01,    to: filler-pouch-01,   medium: salsa caliente,    rate: 2016,  unit: kg/h, piped: true, show: true }
  - { from: buffer-hot-02,    to: filler-sachet-02,  medium: salsa caliente,    rate: 1344,  unit: kg/h, piped: true }
  - { from: buffer-cold-01,   to: filler-sachet-01,  medium: mayonesa,          rate: 1395,  unit: kg/h, piped: true, show: true }
  - { from: buffer-cold-02,   to: filler-pouch-02,   medium: mayonesa,          rate: 1674,  unit: kg/h, piped: true }
  - { from: buffer-mustard-01, to: filler-sachet-03, medium: mostaza,           rate: 945,   unit: kg/h, piped: true }
  - { from: filler-pouch-01,  to: cooling-tunnel-01, medium: sachets calientes, rate: 30,    unit: u/min, show: true }
  - { from: filler-sachet-02, to: cooling-tunnel-01, medium: sachets calientes, rate: 80,    unit: u/min }
  - { from: cooling-tunnel-01, to: checkweigher-01,  medium: sachets 1000 ml,   rate: 30,    unit: u/min }
  - { from: cooling-tunnel-01, to: checkweigher-02,  medium: sachets 250 ml,    rate: 80,    unit: u/min }
  - { from: filler-pouch-02,  to: checkweigher-01,   medium: sachets 1000 ml,   rate: 30,    unit: u/min }
  - { from: filler-sachet-01, to: checkweigher-02,   medium: sachets 250 ml,    rate: 100,   unit: u/min }
  - { from: buffer-cold-01,   to: filler-pouch-03,   medium: mayonesa,          rate: 1256,  unit: kg/h, piped: true }
  - { from: filler-pouch-03,  to: checkweigher-01,   medium: sachets 500 ml,    rate: 45,    unit: u/min }
  - { from: filler-sachet-03, to: checkweigher-02,   medium: sachets 250 ml,    rate: 60,    unit: u/min }
  - { from: checkweigher-01,  to: case-pack-02,      medium: sachets 500 y 1000 ml, rate: 105, unit: u/min, show: true }
  - { from: checkweigher-02,  to: case-pack-01,      medium: sachets 250 ml,    rate: 240,   unit: u/min, show: true }
  - { from: rack-pack-01,     to: filler-sachet-01,  medium: laminado,          rate: 2,     unit: rollos/turno, show: true }
  # Despacho
  - { from: case-pack-01,     to: wrapper-01,        medium: cajas,             rate: 6,     unit: cajas/min }
  - { from: wrapper-01,       to: rack-pt-02,        medium: estibas,           rate: 35,    unit: pallets/d, show: true }
  - { from: rack-pt-02,       to: dock-02,           medium: estibas,           rate: 35,    unit: pallets/d, show: true }
  # Servicios
  - { from: boiler-01,        to: steam-station-01,  medium: vapor,             rate: 900,   unit: kg/h, piped: true }
  - { from: steam-station-01, to: kettle-01,         medium: vapor,             rate: 450,   unit: kg/h, piped: true }
  - { from: steam-station-01, to: kettle-02,         medium: vapor,             rate: 450,   unit: kg/h, piped: true }
  - { from: steam-station-01, to: pasteurizer-01,    medium: vapor,             rate: 300,   unit: kg/h, piped: true }
  - { from: cip-skid-01,      to: kettle-01,         medium: CIP,               rate: 15000, unit: L/h, piped: true }
  - { from: cip-skid-01,      to: filler-pouch-01,   medium: CIP,               rate: 10000, unit: L/h, piped: true }
  - { from: ice-bank-01,      to: emulsifier-01,     medium: agua helada,       rate: 8,     unit: m3/h, piped: true }
  - { from: chiller-01,       to: cooling-tunnel-01, medium: agua fría,         rate: 12,    unit: m3/h, piped: true }
  - { from: ro-01,            to: tank-water-01,     medium: agua tratada,      rate: 3,     unit: m3/h, piped: true }
  - { from: compressor-01,    to: filler-sachet-01,  medium: aire comprimido,   rate: 1.5,   unit: m3/min, piped: true }
  - { from: kettle-01,        to: wwtp-01,           medium: efluente CIP,      rate: 40,    unit: m3/d, piped: true }
