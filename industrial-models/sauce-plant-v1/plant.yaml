# Planta de salsas, emulsiones y aderezos.
# Planta ficticia de referencia (manufactura por procesos: batch + continuo,
# con envasado discreto al final). Valores estimados, no datos de una planta real.
#
# Convenciones: iguales a plastic-injection-plant-v1/plant.yaml
#   - Metros, origen suroeste, x = este, y = norte, z = arriba.
#   - zones[].rect = [x_min, y_min, ancho_x, largo_y]
#   - equipment[].position = centro de la huella; footprint = [dx, dy, dz]

schema_version: 0.1.0

plant:
  id: sauce-plant-v1
  name: Planta de salsas y aderezos (referencia)
  kind: process
  units: { length: m, angle: deg, mass: kg, time: s, temperature: degC }
  frame: { origin: esquina suroeste, x: este, y: norte, z: arriba }
  site: { width_x: 112, length_y: 72 }
  context:
    location: Valle de Aburrá, Colombia (~1.500 m s. n. m.)
    employees: 80
    shifts: 2 turnos, 6 días
    daily_output_t: 22
    product_families:
      - "emulsiones en frío: mayonesa (natural, chipotle, jalapeño), salsa rosada, mayonesa-mostaza"
      - "salsas en caliente: salsa de tomate (reconstituida desde pasta), salsa BBQ"
      - mostaza
    packaging: [sachet 250 ml, sachet 500 ml, sachet 1000 ml]
    assumptions:
      - Área construida ≈ 5.200 m² incluyendo bodegas.
      - Agua de proceso a 1.500 m s. n. m.: ebullición ≈ 95 °C, por eso la cocción abierta se limita a 85-90 °C.
      - La salsa de tomate se pasteuriza en continuo durante la transferencia y se llena en caliente (≥ 85 °C).
      - Todo el producto se envasa en sachet (laminado PET/PE apto para llenado en caliente); no hay botellas.

layout_concept: >
  Flujo unidireccional oeste → este con zonificación higiénica creciente:
  zona sucia (recepción, bodegas de materia prima) al oeste; zona limpia
  (pesaje, proceso caliente al sur, proceso frío al norte, CIP y tanques
  pulmón) al centro; zona de alto cuidado (llenado) al centro-este, con
  esclusa propia; encajado, bodega de producto terminado y despacho al
  este. Los alérgenos (huevo, mostaza) tienen bodega y báscula dedicadas.
  Caldera, aire, agua, frío, subestación y PTAR quedan fuera del edificio,
  en la franja sur. Personal entra por vestieres y esclusa sanitaria.

