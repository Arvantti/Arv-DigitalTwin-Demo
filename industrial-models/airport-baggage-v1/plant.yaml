  - { id: aircraft-02,  type: aircraft,           zone: plataforma, position: [145, 18, 0], footprint: [38, 36, 12], params: { flight: "Vuelo 880 (llegada)" } }
  - { id: carts-arr-01, type: baggage_cart_train, zone: plataforma, position: [114, 20, 0], footprint: [12, 2.2, 1.9], rotation_deg: 90 }

  # --- Llegadas ---
