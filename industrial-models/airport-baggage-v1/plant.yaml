# Sistema de manejo de equipaje (BHS) de una terminal regional de referencia.
# Terminal ficticia (logística), sin aerolíneas ni marcas reales. Los valores son supuestos típicos
# (ficha de diseño del 2026-10-18); los de cada equipo están en su FICHA.md.
#
# Convenciones:
#   - Coordenadas en metros. Origen en la esquina suroeste del predio.
#   - x = este, y = norte, z = arriba.
#   - zones[].rect = [x_min, y_min, ancho_x, largo_y]
#   - equipment[].position = centro de la huella [x, y, z_base]
#   - equipment[].footprint = [dx, dy, dz] antes de rotar (rotation_deg 90 = el eje del equipo apunta al norte)

schema_version: 0.1.0

plant:
  id: airport-baggage-v1
  name: Sistema de equipaje de aeropuerto (referencia)
  kind: discrete
  units: { length: m, angle: deg, mass: kg, time: s }
  frame: { origin: esquina suroeste, x: este, y: norte, z: arriba }
  site: { width_x: 170, length_y: 112 }
  context:
    location: Terminal regional de referencia (~4 millones de pasajeros al año)
    peak_departing_pax_h: 600
    bags_per_pax: 1.1
    flights_in_makeup: 4
    assumptions:
      - Dos islas de 8 mostradores, dos máquinas CT en paralelo, un clasificador de bandejas y 4 carruseles de armado (un vuelo cada uno).
      - Llegadas con dos bandas desde la plataforma y dos carruseles de reclamo.
      - Las maletas fuera de norma, el almacén de maletas tempranas y las conexiones no se modelan todavía.

layout_concept: >
  Flujo de salidas de oeste a este: hall de check-in al oeste (lado tierra), inspección de bodega (CT) y
  salas de nivel 3, clasificador al centro de la sala de equipaje y carruseles de armado al sur del
  clasificador, sobre el patio de carros que da a la plataforma. Llegadas al este: bandas desde la
  plataforma suben al hall de llegadas y descargan en los carruseles de reclamo. Las bandas no se cruzan.

zones:
  - { id: plataforma,         name: Plataforma de aviones,             kind: exterior,   rect: [0, 0, 170, 40],   height: 0 }
  - { id: hall-checkin,       name: Hall de check-in,                  kind: admin,      rect: [0, 64, 56, 46],   height: 12 }
  - { id: hbs,                name: Inspección de equipaje (CT),       kind: production, rect: [56, 72, 17, 28],  height: 8 }
  - { id: nivel3-norte,       name: Nivel 3 norte (revisión manual),   kind: service,    rect: [56, 100, 30, 10], height: 4 }
  - { id: nivel3-sur,         name: Nivel 3 sur (revisión manual),     kind: service,    rect: [56, 58, 17, 14],  height: 4 }
  - { id: sala-control,       name: Sala de control del BHS,           kind: service,    rect: [56, 40, 17, 18],  height: 4 }
  - { id: sala-bhs,           name: Clasificación y armado de vuelos,  kind: production, rect: [73, 40, 47, 60],  height: 8 }
  - { id: inyeccion-llegadas, name: Inyección de llegadas,             kind: production, rect: [120, 40, 50, 18], height: 6 }
  - { id: hall-llegadas,      name: Hall de llegadas (reclamo),        kind: admin,      rect: [120, 58, 50, 52], height: 10 }

equipment:
  # --- Check-in (salidas) ---
  - { id: checkin-a,    type: checkin_island, zone: hall-checkin, position: [24.5, 97.3, 0],  footprint: [29, 11, 2.6], params: { counters: 8 } }
  - { id: checkin-b,    type: checkin_island, zone: hall-checkin, position: [24.5, 74.7, 0],  footprint: [29, 11, 2.6], rotation_deg: 180, params: { counters: 8 } }
  - { id: collector-a,  type: belt_conveyor,  zone: hall-checkin, position: [33, 91, 0],      footprint: [46, 1.6, 4.6], params: { length_m: 46 } }
  - { id: collector-b,  type: belt_conveyor,  zone: hall-checkin, position: [33, 81, 0],      footprint: [46, 1.6, 4.6], params: { length_m: 46 } }

  # --- Inspección de bodega y nivel 3 ---
  - { id: screening-01, type: baggage_screening, zone: hbs, position: [60, 91, 0],    footprint: [8, 2.6, 2.1], params: { max_bph: 600, alarm_side: left } }
  - { id: screening-02, type: baggage_screening, zone: hbs, position: [60, 81, 0],    footprint: [8, 2.6, 2.1], params: { max_bph: 600, alarm_side: right } }
  - { id: ct1-curve,    type: belt_curve,        zone: hbs, position: [65, 90.5, 0],  footprint: [2, 2, 1.0], params: { angle_deg: 90, radius_m: 1.5, width_m: 1.0, height_m: 0.75, turn: right } }
  - { id: induct-01,    type: belt_conveyor,     zone: hbs, position: [65.5, 85.5, 0], footprint: [8, 1.0, 1.4], rotation_deg: 270, params: { length_m: 8 } }
  - { id: induct-02,    type: belt_conveyor,     zone: hbs, position: [68.5, 81, 0],  footprint: [9, 1.0, 3.9], params: { length_m: 9 } }
  - { id: alarm-belt-01, type: belt_conveyor,    zone: hbs, position: [63.25, 96.15, 0], footprint: [7.7, 1.6, 2.8], rotation_deg: 90,  params: { length_m: 7.7 } }
  - { id: alarm-belt-02, type: belt_conveyor,    zone: hbs, position: [63.25, 75.85, 0], footprint: [7.7, 1.6, 2.8], rotation_deg: 270, params: { length_m: 7.7 } }
  - { id: l3-01,        type: bag_handling_station, zone: nivel3-norte, position: [66.85, 104, 0], footprint: [9.2, 5, 2.4], params: { role: l3, operators: 3 } }
  - { id: l3-02,        type: bag_handling_station, zone: nivel3-sur,   position: [66.85, 67, 0],  footprint: [9.2, 5, 2.4], params: { role: l3, operators: 3 } }
  # regreso de nivel 3 al clasificador: cada sala devuelve por su banda a la línea de inducción, con curvas motorizadas
  - { id: l3n-curve-1,   type: belt_curve,    zone: nivel3-norte, position: [72.2, 105.7, 0],  footprint: [1.5, 1.5, 1.0], params: { angle_deg: 90, radius_m: 1.0, width_m: 1.0, height_m: 0.75, turn: right } }
  - { id: l3n-return-1,  type: belt_conveyor, zone: nivel3-norte, position: [72.45, 102.475, 0], footprint: [4.95, 1.0, 1.0], rotation_deg: 270, params: { length_m: 4.95 } }
  - { id: l3n-return-2,  type: belt_conveyor, zone: hbs,          position: [72.45, 94, 0],    footprint: [12, 1.0, 1.0], rotation_deg: 270, params: { length_m: 12 } }
  - { id: l3n-curve-2,   type: belt_curve,    zone: hbs,          position: [72.2, 87.25, 0],  footprint: [1.5, 1.5, 1.0], rotation_deg: 270, params: { angle_deg: 90, radius_m: 1.0, width_m: 1.0, height_m: 0.75, turn: right } }
  - { id: l3n-return-3,  type: belt_conveyor, zone: hbs,          position: [68.725, 87, 0],   footprint: [5.45, 1.0, 1.2], rotation_deg: 180, params: { length_m: 5.45 } }
  - { id: l3s-curve-1,   type: belt_curve,    zone: nivel3-sur,   position: [72.2, 69.2, 0],   footprint: [1.5, 1.5, 1.0], params: { angle_deg: 90, radius_m: 1.0, width_m: 1.0, height_m: 0.75, turn: left } }
  - { id: l3s-return-1,  type: belt_conveyor, zone: nivel3-sur,   position: [72.45, 70.975, 0], footprint: [2.05, 1.0, 1.0], rotation_deg: 90, params: { length_m: 2.05 } }
  - { id: l3s-return-2,  type: belt_conveyor, zone: hbs,          position: [72.45, 75.25, 0], footprint: [6.5, 1.0, 3.0], rotation_deg: 90, params: { length_m: 6.5 } }
  - { id: l3s-curve-2,   type: belt_curve,    zone: hbs,          position: [72.2, 79.25, 0],  footprint: [1.5, 1.5, 3.0], rotation_deg: 90, params: { angle_deg: 90, radius_m: 1.0, width_m: 1.0, height_m: 2.72, turn: left } }
  - { id: l3s-curve-3,   type: belt_curve,    zone: hbs,          position: [70.7, 79.75, 0],  footprint: [1.5, 1.5, 3.0], rotation_deg: 180, params: { angle_deg: 90, radius_m: 1.0, width_m: 1.0, height_m: 2.72, turn: right } }

  # --- Clasificación y armado ---
  - { id: sorter-01,    type: baggage_sorter,    zone: sala-bhs, position: [93, 84.9, 0],   footprint: [40, 14.5, 5.1], params: { destinations: 4, flights: [V101, V205, V317, V422] } }
  - { id: encoding-01,  type: bag_handling_station, zone: sala-bhs, position: [111.2, 75.2, 0], footprint: [4.4, 3, 2.4], params: { role: encoding, operators: 1 } }
  # regreso de codificación manual: sube por el costado este hasta la reinducción del lado de retorno del clasificador
  - { id: enc-curve-1,  type: belt_curve,       zone: sala-bhs, position: [114.05, 76.3, 0],  footprint: [1.3, 1.3, 1.0], params: { angle_deg: 90, radius_m: 0.8, width_m: 1.0, height_m: 0.75, turn: left } }
  - { id: enc-return,   type: belt_conveyor,    zone: sala-bhs, position: [114.2, 85.075, 0], footprint: [16.25, 1.0, 3.8], rotation_deg: 90, params: { length_m: 16.25 } }
  - { id: enc-curve-2,  type: belt_curve,       zone: sala-bhs, position: [113.85, 94.05, 0], footprint: [1.7, 1.7, 3.8], rotation_deg: 90, params: { angle_deg: 90, radius_m: 1.2, width_m: 1.0, height_m: 3.5, turn: left } }
  - { id: makeup-01,    type: baggage_carousel,  zone: sala-bhs, position: [82.14, 68.1, 0], footprint: [19.1, 6.6, 1.9], rotation_deg: 90, params: { flight: V101 } }
  - { id: makeup-02,    type: baggage_carousel,  zone: sala-bhs, position: [89.91, 68.1, 0], footprint: [19.1, 6.6, 1.9], rotation_deg: 90, params: { flight: V205 } }
  - { id: makeup-03,    type: baggage_carousel,  zone: sala-bhs, position: [97.69, 68.1, 0], footprint: [19.1, 6.6, 1.9], rotation_deg: 90, params: { flight: V317 } }
  - { id: makeup-04,    type: baggage_carousel,  zone: sala-bhs, position: [105.46, 68.1, 0], footprint: [19.1, 6.6, 1.9], rotation_deg: 90, params: { flight: V422 } }
  - { id: carts-01,     type: baggage_cart_train, zone: sala-bhs, position: [81.34, 48, 0], footprint: [12, 2.2, 1.9], rotation_deg: 270 }
  - { id: carts-02,     type: baggage_cart_train, zone: sala-bhs, position: [89.11, 48, 0], footprint: [12, 2.2, 1.9], rotation_deg: 270 }
  - { id: carts-03,     type: baggage_cart_train, zone: sala-bhs, position: [96.89, 48, 0], footprint: [12, 2.2, 1.9], rotation_deg: 270 }
  - { id: carts-04,     type: baggage_cart_train, zone: sala-bhs, position: [104.66, 48, 0], footprint: [12, 2.2, 1.9], rotation_deg: 270 }

  # --- Sala de control del BHS ---
  - { id: plc-bhs-01,      type: plc_cabinet,   zone: sala-control, position: [60, 42.5, 0], footprint: [2.4, 0.7, 2.1], params: { rack: "CPU + E/S remotas por zona", network: "Ethernet industrial hacia las bandas, la CT y el clasificador" } }
  - { id: operator-desk-bhs, type: operator_desk, zone: sala-control, position: [64.5, 49, 0], footprint: [3.2, 1.2, 1.1], params: { monitors: 2 } }
  - id: bhs-wall-01
    type: control_panel
    zone: sala-control
    position: [64.5, 56, 0]
    footprint: [8, 0.3, 2.6]
    rotation_deg: 180
    params: {}
    panel:
      title: Panel del BHS
      slots:
        - { title: Fila check-in A,        equipment: checkin-a,    variable: pax_queue,    unit: pax }
        - { title: Fila check-in B,        equipment: checkin-b,    variable: pax_queue,    unit: pax }
        - { title: Cola nivel 2 CT 1,      equipment: screening-01, variable: l2_queue,     unit: maletas }
        - { title: Cola nivel 2 CT 2,      equipment: screening-02, variable: l2_queue,     unit: maletas }
        - { title: Ocupación clasificador, equipment: sorter-01,    variable: occupancy_pct, unit: "%" }
        - { title: Carrusel V101,        equipment: makeup-01,    variable: occupancy_pct, unit: "%" }
        - { title: Mesa nivel 3 norte,     equipment: l3-01,        variable: queue,        unit: maletas }
        - { title: Reclamo 1,              equipment: reclaim-01,   variable: bags_on,      unit: maletas }

  # --- Plataforma ---
