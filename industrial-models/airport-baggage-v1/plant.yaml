  - { id: inbound-02,   type: belt_conveyor,    zone: inyeccion-llegadas, position: [152.2, 49, 0], footprint: [18, 1.6, 4.0], rotation_deg: 90, params: { length_m: 18 } }
  - { id: reclaim-01,   type: baggage_carousel, zone: hall-llegadas, position: [131, 72, 0],  footprint: [27.9, 8.6, 2.0], rotation_deg: 90, params: { mode: reclaim } }
  - { id: reclaim-02,   type: baggage_carousel, zone: hall-llegadas, position: [153, 72, 0],  footprint: [27.9, 8.6, 2.0], rotation_deg: 90, params: { mode: reclaim } }

flows:
  # Salidas
  - { from: checkin-a,    to: collector-a,  medium: maletas, rate: 330, unit: u/h, show: true }
  - { from: checkin-b,    to: collector-b,  medium: maletas, rate: 330, unit: u/h, show: true }
  - { from: collector-a,  to: screening-01, medium: maletas, rate: 330, unit: u/h }
  - { from: collector-b,  to: screening-02, medium: maletas, rate: 330, unit: u/h }
  - { from: screening-01, to: induct-01,    medium: maletas despejadas, rate: 315, unit: u/h }
  - { from: screening-02, to: induct-02,    medium: maletas despejadas, rate: 315, unit: u/h }
  - { from: induct-01,    to: induct-02,    medium: maletas, rate: 315, unit: u/h, note: confluencia de la línea norte }
  - { from: induct-02,    to: sorter-01,    medium: maletas, rate: 630, unit: u/h, show: true }
  - { from: screening-01, to: alarm-belt-01, medium: maletas con alarma, rate: 16, unit: u/h }
  - { from: screening-02, to: alarm-belt-02, medium: maletas con alarma, rate: 16, unit: u/h }
  - { from: alarm-belt-01, to: l3-01,       medium: maletas con alarma, rate: 16, unit: u/h, show: true }
  - { from: alarm-belt-02, to: l3-02,       medium: maletas con alarma, rate: 16, unit: u/h, show: true }
  - { from: l3-01,        to: l3n-return-1, medium: maletas despejadas, rate: 16, unit: u/h, note: banda de regreso de nivel 3 norte }
  - { from: l3n-return-1, to: l3n-return-2, medium: maletas despejadas, rate: 16, unit: u/h }
  - { from: l3n-return-2, to: l3n-return-3, medium: maletas despejadas, rate: 16, unit: u/h }
  - { from: l3n-return-3, to: induct-01,    medium: maletas despejadas, rate: 16, unit: u/h, note: entra de costado a la línea norte }
  - { from: l3-02,        to: l3s-return-1, medium: maletas despejadas, rate: 16, unit: u/h, note: banda de regreso de nivel 3 sur }
  - { from: l3s-return-1, to: l3s-return-2, medium: maletas despejadas, rate: 16, unit: u/h }
  - { from: l3s-return-2, to: induct-02,    medium: maletas despejadas, rate: 16, unit: u/h, note: entra de costado a la inducción }
  - { from: sorter-01,    to: makeup-01,    medium: maletas V101, rate: 190, unit: u/h, show: true }
  - { from: sorter-01,    to: makeup-02,    medium: maletas V205, rate: 158, unit: u/h, show: true }
  - { from: sorter-01,    to: makeup-03,    medium: maletas V317, rate: 158, unit: u/h, show: true }
  - { from: sorter-01,    to: makeup-04,    medium: maletas V422, rate: 127, unit: u/h, show: true }
  - { from: sorter-01,    to: encoding-01,  medium: maletas sin lectura, rate: 20, unit: u/h }
  - { from: encoding-01,  to: enc-return,   medium: maletas codificadas, rate: 20, unit: u/h, note: banda de regreso de codificación }
  - { from: enc-return,   to: sorter-01,    medium: maletas codificadas, rate: 20, unit: u/h, note: reinducción del lado de retorno }
  - { from: makeup-01,    to: carts-01,     medium: maletas, rate: 190, unit: u/h }
  - { from: makeup-02,    to: carts-02,     medium: maletas, rate: 158, unit: u/h }
  - { from: makeup-03,    to: carts-03,     medium: maletas, rate: 158, unit: u/h }
  - { from: makeup-04,    to: carts-04,     medium: maletas, rate: 127, unit: u/h }
  - { from: carts-01,     to: aircraft-01,  medium: carros de equipaje, rate: 6, unit: carros/h, show: true }
  # Llegadas
  - { from: aircraft-02,  to: carts-arr-01, medium: maletas, rate: 180, unit: u/vuelo }
  - { from: carts-arr-01, to: inbound-01,   medium: maletas, rate: 180, unit: u/vuelo, show: true }
  - { from: inbound-01,   to: reclaim-01,   medium: maletas, rate: 1200, unit: u/h, show: true }
  - { from: inbound-02,   to: reclaim-02,   medium: maletas, rate: 1200, unit: u/h, show: true }

lines:
  - { id: line-departures, name: Salidas,  mode: discrete, equipment: [checkin-a, checkin-b, collector-a, collector-b, screening-01, screening-02, sorter-01, makeup-01, makeup-02, makeup-03, makeup-04] }
  - { id: line-arrivals,   name: Llegadas, mode: discrete, equipment: [inbound-01, inbound-02, reclaim-01, reclaim-02] }
