[project]
name = "water-network-cosim-model-api"
version = "0.1.0"
description = "Endpoint de contrato para el modelo hidráulico horario cuasiestacionario del acueducto"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/water_network_cosim_model_api"]
