[project]
name = "fractal-optimization-api"
version = "0.1.0"
description = "Proceso aislado de trabajos de optimización Fractal; recomendaciones de solo lectura"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "numpy>=2", "scipy>=1.14", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_optimization_api"]
