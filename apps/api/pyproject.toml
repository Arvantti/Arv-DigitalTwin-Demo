[project]
name = "twin-api"
version = "0.1.0"
description = "API del gemelo digital: librería de equipos y simulación en tiempo real"
requires-python = ">=3.11"
dependencies = ["twin-runtime", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.uv.sources]
twin-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_api"]
