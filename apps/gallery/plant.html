<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escena de planta · Gemelo digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <header class="topbar glass">
      <div class="brand"><span class="logo">◆</span> TWIN<span class="dim">/</span>PLANT</div>
      <div class="title"><span id="plant-name">—</span><span class="dim" id="plant-meta"></span></div>
      <div class="lighting" id="lighting"></div>
      <div class="clock" id="clock">SIM · DESCONECTADA</div>
    </header>
    <aside class="sidebar glass" id="sidebar">
      <a class="nav-link" href="/">◀ INICIO</a>
      <a class="nav-link" id="link-equipos" href="/equipos.html">▤ EQUIPOS DE ESTA PLANTA</a>
      <h3>CÁMARAS</h3>
      <div id="cameras" class="commands"></div>
      <div class="sim-controls"><button id="btn-tour">▶ RECORRIDO</button></div>
      <div id="tour-stop" class="dim tour-stop"></div>
      <h3>ESCENARIO</h3>
      <select id="scenario"></select>
      <div class="sim-controls">
        <button id="btn-connect" class="primary">▶ SIMULAR</button>
        <button id="btn-pause">❚❚</button>
      </div>
      <label class="speed">Velocidad <span id="speed-val">×60</span>
        <input id="speed" type="range" min="0" max="4" step="0.01" value="1.78" />
      </label>
      <h3>LÍNEAS</h3>
      <div id="lines" class="lines"></div>
    </aside>
    <section class="hud glass" id="hud">
      <div class="label">ACTIVO SELECCIONADO</div>
      <div id="asset-name" class="asset-name">Haz clic en un equipo</div>
      <div id="asset-meta" class="dim"></div>
      <div class="hud-head">
        <div><div class="label">ESTADO</div><div id="state" class="state">—</div></div>
        <div><div class="label">FASE</div><div id="phase" class="phase">—</div></div>
      </div>
      <div id="faults" class="faults"></div>
      <div id="commands" class="commands"></div>
      <div class="label">VARIABLES <span class="dim">· simulado</span></div>
      <div id="vars" class="vars"></div>
    </section>
    <section class="events glass" id="events-panel">
      <div class="label">EVENTOS DE PLANTA</div>
      <ol id="events"></ol>
    </section>
    <script type="module" src="/src/plant.ts"></script>
  </body>
</html>
