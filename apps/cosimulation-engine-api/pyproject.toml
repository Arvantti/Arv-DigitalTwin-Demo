[project]
name = "cosimulation-engine-api"
version = "0.1.0"
description = "API independiente de trabajos para proyectar un solo modelo cosimulado por contrato"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosimulation_engine_api"]
