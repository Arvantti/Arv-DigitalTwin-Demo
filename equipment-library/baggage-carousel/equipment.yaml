schema_version: 0.1.0
type: baggage-carousel
version: 0.1.0
name: Carrusel de equipaje
manufacturing: logistics
category: transport.carousel
description: >
  Carrusel de placas articuladas en óvalo. En salidas es el carrusel de armado: recibe las maletas
  de un vuelo desde la rampa del clasificador y los operarios las pasan a los carros o contenedores.
  En llegadas es el carrusel de reclamo: recibe las maletas que llegan del avión y los pasajeros
  las recogen. Cuando se llena deja de recibir y bloquea lo que lo alimenta.
aliases: [carrusel, banda de reclamo, carrusel de armado, make-up, reclaim, carrusel de equipaje]
fidelity: { visual: V2, behavior: B2 }

params:
  mode:               { type: enum, values: [makeup, reclaim], default: makeup, description: "Armado (operarios cargan carros) o reclamo (pasajeros recogen)", affects: [behavior, geometry] }
  length_m:           { type: number, unit: m, min: 10, max: 120, default: 40, description: Largo del recorrido de placas, affects: [geometry, behavior] }
  width_m:            { type: number, unit: m, min: 2, max: 12, default: 5, description: "Ancho exterior del óvalo de placas (sin la franja de 1,6 m de personas)", affects: [geometry] }
  pitch_m:            { type: number, unit: m, min: 0.5, max: 2, default: 1.0, description: Espacio que ocupa una maleta sobre las placas, affects: [behavior, geometry] }
  speed_m_s:          { type: number, unit: m/s, min: 0.1, max: 1, default: 0.45, description: Velocidad de las placas, affects: [behavior] }
  fill_limit_pct:     { type: number, unit: "%", min: 10, max: 100, default: 90, description: Ocupación a la que deja de recibir, affects: [behavior] }
  handlers:           { type: integer, min: 0, max: 10, default: 2, description: Operarios que cargan carros (armado), affects: [behavior, geometry] }
  handler_upm:        { type: number, unit: maletas/min, min: 0.5, max: 10, default: 4, description: Maletas que carga cada operario por minuto, affects: [behavior] }
  pick_upm:           { type: number, unit: maletas/min, min: 1, max: 120, default: 25, description: Maletas que recogen los pasajeros por minuto (reclamo), affects: [behavior] }
  pick_delay_s:       { type: number, unit: s, min: 0, max: 3600, default: 120, description: Tiempo entre la primera maleta y la llegada de los pasajeros (reclamo), affects: [behavior] }
  entry_buffer_units: { type: integer, min: 1, max: 32, default: 4, description: Maletas que caben esperando en la rampa o banda de entrada, affects: [behavior] }
  nominal_inflow_upm: { type: number, unit: maletas/min, min: 0, max: 60, default: 0, description: Llegada de maletas si el entorno no la fija, affects: [behavior] }
  plate_color:        { type: string, default: "#3b4148", description: Color de las placas (hex), affects: [geometry] }
  motor_kw:           { type: number, unit: kW, min: 0.5, max: 15, default: 2.2, description: Potencia del motor, affects: [behavior, geometry] }

ports:
  - { id: bags_in, kind: item, direction: in, unit: maletas/min, link: { units: inflow_upm, ready: accepting } }
  - { id: bags_out, kind: item, direction: out, unit: maletas/min, link: { units: removed, ready: downstream_free } }
  - { id: power, kind: utility, direction: in, medium: energía eléctrica }

states:
  - { id: idle, description: Sin maletas }
  - { id: running, description: Recibiendo o entregando maletas }
  - { id: blocked, description: "Lleno: maletas esperando en la entrada" }
  - { id: fault, description: Detenido por falla }

variables:
  - { id: bags_on, unit: maletas, kind: calculated, description: Maletas sobre las placas }
  - { id: occupancy_pct, unit: "%", kind: calculated, range: [0, 100], description: Ocupación del carrusel }
  - { id: received, unit: maletas, kind: counter, description: Maletas recibidas }
  - { id: removed, unit: maletas, kind: counter, description: Maletas retiradas (a carros o por pasajeros) }
  - { id: entry_queue, unit: maletas, kind: calculated, description: Maletas esperando entrar }
  - { id: accepting, unit: "", kind: status, description: "1 si recibe maletas, 0 si la entrada está llena (vuelve a recibir con una plaza libre)" }
  - { id: speed_actual_m_s, unit: m/s, kind: measured, range: [0, 1], noise_sd: 0.002, resolution: 0.001, description: Velocidad de las placas }
  - { id: motor_current_a, unit: A, kind: measured, range: [0, 60], noise_sd: 0.03, resolution: 0.01, description: Corriente del motor }

events:
  - { id: full, description: El carrusel se llenó y dejó de recibir }
  - { id: accepting_again, description: El carrusel vuelve a recibir }
  - { id: first_bag, description: Primera maleta de una oleada (reclamo) }
  - { id: last_bag, description: Se retiró la última maleta de la oleada (reclamo) }

faults:
  - { id: drive_trip, description: Disparo del motor, mtbf_h: 6000, mttr_min: 20, severity: medium, effect: "Las placas se detienen; se retira la mitad del ritmo (solo lo que queda al alcance)" }
  - { id: plate_jam, description: Placa trabada, mtbf_h: 1500, mttr_min: 10, severity: medium, effect: "Las placas se detienen; se retira la mitad del ritmo" }

commands:
  - { id: set_handlers, description: Cambia los operarios del carrusel de armado, args: { n: integer } }
  - { id: inject_fault, description: Inyecta una falla declarada, args: { fault: string, duration_s: number } }
  - { id: clear_fault, description: Repara una falla activa, args: { fault: string } }
  - { id: set_param, description: Cambia un parámetro en caliente, args: { name: string, value: any } }

kpis:
  - { id: bags_per_h, unit: maletas/h, description: Maletas retiradas por hora }
  - { id: max_occupancy_pct, unit: "%", description: Ocupación máxima }
  - { id: wave_min, unit: min, description: "Reclamo: duración de la última oleada, de la primera maleta a la última retirada" }
  - { id: full_pct, unit: "", description: Fracción del tiempo lleno }

animation_channels:
  - { id: travel, unit: m, range: [0, 120], description: Recorrido de las placas (módulo su largo) }
  - { id: bags_count, range: [0, 240], description: Maletas sobre las placas }
  - { id: handlers_active, range: [0, 10], description: Operarios cargando }
  - { id: stack_light, range: [0, 3], description: "0 apagado, 1 verde, 2 ámbar (lleno), 3 rojo (falla)" }

geometry:
  parts: [plates, frame, skirt, center_island, infeed_chute, handlers, carts, drive, beacon]

assumptions:
  - Las maletas entran de a una cada pitch_m ÷ speed_m_s s y se retiran al ritmo de los operarios o de los pasajeros mientras haya maletas.
  - En reclamo los pasajeros empiezan a recoger pick_delay_s después de la primera maleta de la oleada; una oleada termina cuando el carrusel queda vacío y sin maletas en la entrada.
  - En armado los operarios cargan solo si hay carro disponible (downstream_free).
