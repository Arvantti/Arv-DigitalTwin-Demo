geometry:
  parts: [bay, floor_marking, forklift, charger, signs]

assumptions:
  - "Cada ruta tiene su largo (route_N_m); el viaje de ida y el de regreso toman cada uno largo ÷ speed_m_s."
  - "Un montacargas atiende cualquier ruta de su flota; toma primero la estiba que lleva más tiempo esperando (FIFO entre rutas; la de menor número si empatan)."
  - "El corredor es compartido: se exige headway_s entre salidas de cualquier ruta. Con carriles separados de ida y regreso, el regreso no choca con las salidas."
  - "Las piezas de la estiba llegan al destino al terminar la descarga y salen hacia el siguiente equipo al ritmo feed_upm."
  - "Una falla deja un montacargas menos disponible para nuevos viajes; el viaje en curso termina."
