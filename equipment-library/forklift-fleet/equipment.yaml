schema_version: 0.1.0
type: forklift-fleet
version: 0.1.0
name: Flota de montacargas por área
manufacturing: discrete
category: logistics.transport
description: >
  Flota finita de montacargas que lleva estibas entre un origen y un destino por rutas fijas (hasta 10 rutas). Cada
  estiba espera su turno en la cola de su ruta, un montacargas libre la carga, la lleva a velocidad constante, la
  descarga y regresa por el carril contrario. Los montacargas comparten el corredor: no salen a la vez (separación mínima
  entre salidas) y adelante no hay adelantamientos, así no se cruzan ni se traspasan. Si todos están ocupados o no hay
  espacio en el destino, las estibas esperan en el origen.
aliases: [flota de montacargas, montacargas, forklift fleet, forklift, transporte de estibas, carretillas elevadoras]
fidelity: { visual: V2, behavior: B2 }

params:
  vehicles:       { type: integer, min: 1, max: 12, default: 4, description: Montacargas de la flota, affects: [behavior, geometry] }
  speed_m_s:      { type: number, unit: m/s, min: 0.5, max: 4, default: 2, description: Velocidad de marcha (carga y vacío), affects: [behavior] }
  load_s:         { type: number, unit: s, min: 0, max: 300, default: 45, description: Tiempo de recoger la estiba en el origen, affects: [behavior] }
  unload_s:       { type: number, unit: s, min: 0, max: 300, default: 45, description: Tiempo de dejar la estiba en el destino, affects: [behavior] }
  headway_s:      { type: number, unit: s, min: 0, max: 300, default: 30, description: "Separación mínima entre salidas por el corredor compartido (nadie adelanta ni sale encima de otro)", affects: [behavior] }
  pallet_pieces:  { type: integer, min: 1, max: 5000, default: 1000, description: Piezas por estiba, affects: [behavior] }
  max_pallets_per_route: { type: integer, min: 1, max: 8, default: 2, description: "Estibas por ruta entre cola, viaje y entrega pendiente antes de dejar de aceptar más", affects: [behavior] }
  parking_pose:   { type: string, default: bay, description: Cómo se muestran los montacargas en reposo (bay), affects: [geometry] }
  route_1_m:       { type: number, unit: m, min: 5, max: 1000, default: 100, description: Largo de la ruta 1 (origen a destino), affects: [behavior] }
  route_1_feed_upm: { type: number, unit: u/min, min: 0.1, max: 1000000, default: 1000000, description: "Ritmo máximo al que entrega en el destino las piezas de la estiba de la ruta 1 (en una línea de ensamble, lo que se saca de la estiba)", affects: [behavior] }
