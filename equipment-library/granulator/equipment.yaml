schema_version: 0.1.0
type: granulator
version: 0.1.0
name: Molino granulador de plástico
manufacturing: process
category: plastics.size-reduction
description: >
  Molino de cuchillas para triturar scrap, mazarotas y piezas rechazadas en granulado. Recibe el
  material en una tolva, lo reduce con un rotor de cuchillas contra cuchillas fijas y lo deja pasar
  por una criba. El filo de las cuchillas se gasta con el material procesado: la capacidad baja,
  el motor trabaja más y aumentan los finos y el polvo hasta que se afilan.
aliases: [molino, granulador, triturador, molino de cuchillas, molino de reciclaje]
fidelity: { visual: V2, behavior: B2 }

params:
  throughput_kg_h:       { type: number, unit: kg/h, min: 10, max: 3000, default: 500, description: Capacidad nominal con cuchillas afiladas y criba de 10 mm, affects: [geometry, behavior] }
  screen_mm:             { type: number, unit: mm, min: 4, max: 25, default: 10, description: Abertura de la criba, affects: [geometry, behavior] }
  motor_kw:              { type: number, unit: kW, min: 1, max: 200, default: 37, description: Potencia del motor del rotor, affects: [geometry, behavior] }
  hopper_kg:             { type: number, unit: kg, min: 10, max: 2000, default: 150, description: Material que cabe en la tolva de alimentación, affects: [geometry, behavior] }
  nominal_feed_kg_h:     { type: number, unit: kg/h, min: 0, max: 3000, default: 300, description: Alimentación si el entorno no la fija, affects: [behavior] }
  knife_life_t:          { type: number, unit: t, min: 5, max: 2000, default: 150, description: Material que procesan las cuchillas desde nuevas hasta quedar sin filo, affects: [behavior] }
  start_sharpness_pct:   { type: number, unit: "%", min: 0, max: 100, default: 100, description: Filo de las cuchillas al empezar, affects: [behavior] }
  start_on:              { type: boolean, default: true, description: Arranca encendido, affects: [behavior] }

ports:
  - { id: scrap_in, kind: material, direction: in, medium: scrap plástico, unit: kg/h, link: { flow_kg_h: feed_kg_h, ready: accepting } }
  - { id: granulate_out, kind: material, direction: out, medium: granulado, unit: kg/h, link: { flow_kg_h: flow_kg_h, ready: downstream_free } }
  - { id: power, kind: utility, direction: in, medium: energía eléctrica }

states:
  - { id: "off", description: Apagado }
  - { id: running, description: Triturando }
  - { id: starved, description: Rotor girando sin material }
  - { id: blocked, description: La salida no recibe el granulado }
  - { id: fault, description: Detenido por falla }

variables:
  - { id: hopper_level_pct, unit: "%", kind: calculated, range: [0, 100], description: Nivel de la tolva de alimentación }
  - { id: flow_kg_h, unit: kg/h, kind: calculated, description: Caudal de granulado que entrega }
  - { id: processed_kg, unit: kg, kind: counter, description: Material triturado acumulado }
  - { id: accepting, unit: "", kind: status, description: "1 si acepta más material, 0 si la tolva está llena" }
  - { id: knife_sharpness_pct, unit: "%", kind: calculated, range: [0, 100], description: Filo de las cuchillas }
  - { id: fines_pct, unit: "%", kind: calculated, description: Finos y polvo en el granulado }
  - { id: motor_current_a, unit: A, kind: measured, range: [0, 400], noise_sd: 0.2, resolution: 0.1, description: Corriente del motor }
  - { id: power_kw, unit: kW, kind: calculated, description: Potencia eléctrica del motor }

events:
  - { id: sharpen_needed, description: El filo bajó de 40 % y conviene afilar las cuchillas }
  - { id: knives_sharpened, description: Se afilaron las cuchillas }
  - { id: hopper_full, description: La tolva se llenó y deja de recibir }

faults:
  - { id: jam, description: Atasco del rotor por una pieza dura o demasiado grande, mtbf_h: 300, mttr_min: 10, severity: medium, effect: El rotor se detiene hasta destrabarlo }
  - { id: dull_knives, description: Cuchillas desafiladas por contaminación del scrap, mtbf_h: 800, mttr_min: 30, severity: low, stops_equipment: false, effect: "Pierde capacidad, sube la corriente y aumentan los finos hasta afilar" }

commands:
  - { id: start, description: Enciende el molino }
  - { id: stop, description: Apaga el molino }
  - { id: sharpen, description: Afila las cuchillas y devuelve el filo a 100 % }
  - { id: inject_fault, description: Inyecta una falla declarada, args: { fault: string, duration_s: number } }
  - { id: clear_fault, description: Repara una falla activa, args: { fault: string } }
  - { id: set_param, description: Cambia un parámetro en caliente, args: { name: string, value: any } }

kpis:
  - { id: specific_energy_kwh_t, unit: kWh/t, description: Energía por tonelada triturada }
  - { id: utilization, unit: "", description: Fracción del tiempo triturando }

animation_channels:
  - { id: rotor_speed, range: [0, 1], description: "Giro del rotor (0 parado, 1 a velocidad nominal)" }
  - { id: hopper_fill, range: [0, 1], description: Nivel de la tolva }
  - { id: motor_load, range: [0, 1.2], description: Carga del motor como fracción de la nominal }
  - { id: out_flow, range: [0, 1], description: Caudal de salida respecto de la capacidad }
  - { id: stack_light, range: [0, 3], description: "Baliza: 0 apagada, 1 verde, 2 amarilla, 3 roja" }

geometry:
  parts: [frame, grinding_chamber, door, hopper, motor, belt_guard, flywheel, discharge_blower, cyclone, collection_bin, hmi, stack_light]

assumptions:
  - "Capacidad efectiva = nominal × (0,6 + 0,4 × filo) × √(criba ÷ 10 mm)."
  - "El filo baja en proporción al material procesado: de 100 % a 0 % en knife_life_t toneladas."
  - "Corriente: 30 % de la nominal en vacío, hasta 90 % a plena carga, y +25 % con las cuchillas del todo desafiladas; nominal ≈ 1,8 A por kW."
  - "Finos: 3 % con cuchillas afiladas, hasta 12 % sin filo."
