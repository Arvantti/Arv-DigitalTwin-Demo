schema_version: 0.1.0
type: lockstitch-sewing-machine
version: 0.1.0
name: Máquina plana de una aguja
manufacturing: discrete
category: sewing.lockstitch
description: Máquina industrial de puntada recta de una aguja y dos hilos para unir y pespuntear piezas textiles; representa un puesto atendido por una operaria.
aliases: [máquina plana, plana industrial, lockstitch sewing machine]
fidelity: { visual: V2, behavior: B2 }
params:
  machine_style: { type: enum, values: [lockstitch], default: lockstitch, description: Variante geométrica de una aguja y puntada recta, affects: [geometry] }
  cycle_s: { type: number, unit: s, min: 1, max: 600, default: 45, description: SAM configurado para la operación de este puesto, affects: [behavior] }
  max_speed_spm: { type: integer, unit: puntadas/min, min: 500, max: 5500, default: 5500, description: Velocidad máxima de referencia; no equivale a prendas por minuto, affects: [behavior, geometry] }
  stitch_length_mm: { type: number, unit: mm, min: 0.5, max: 7, default: 4.5, description: Longitud de puntada configurada, affects: [geometry] }
  nominal_inflow_upm: { type: number, unit: u/min, min: 0, max: 100, default: 2, description: Alimentación nominal de prendas del puesto, affects: [behavior] }
  queue_capacity: { type: integer, min: 1, max: 100, default: 8, description: Piezas máximas en espera en el puesto, affects: [behavior, geometry] }
  length_m: { type: number, unit: m, min: 0.8, max: 2, default: 1.2, description: Largo aproximado de mesa y máquina, affects: [geometry] }
  width_m: { type: number, unit: m, min: 0.45, max: 1.2, default: 0.65, description: Ancho aproximado de mesa y máquina, affects: [geometry] }
  power_kw: { type: number, unit: kW, min: 0.1, max: 2, default: 0.55, description: Potencia eléctrica aproximada del motor integrado, affects: [behavior] }
ports:
  - { id: garments_in, kind: item, direction: in, medium: piezas textiles, unit: u/min, link: { units: inflow_upm, ready: accepting_infeed } }
  - { id: garments_out, kind: item, direction: out, medium: prendas procesadas, unit: u/min, link: { units: units_processed, ready: downstream_free } }
states:
  - { id: idle, description: Puesto detenido o sin operaria asignada }
  - { id: running, description: La operaria cose una pieza }
  - { id: starved, description: Sin piezas en la cola de entrada }
  - { id: blocked, description: La salida no puede recibir la pieza terminada }
  - { id: fault, description: Parada por rotura de hilo o aguja }
phases:
  - { id: sewing, description: Formación de puntada recta durante el tiempo SAM asignado }
variables:
  - { id: units_processed, unit: u, kind: counter, description: Piezas procesadas por este puesto }
  - { id: feed_queue, unit: u, kind: calculated, description: Piezas esperando en el puesto }
  - { id: output_upm, unit: u/min, kind: calculated, description: Caudal de salida nominal mientras cose }
  - { id: cycle_pct, unit: "%", kind: calculated, range: [0, 100], description: Avance del SAM de la pieza actual }
  - { id: needle_speed_spm, unit: puntadas/min, kind: calculated, range: [0, 5500], description: Velocidad instantánea aproximada de la aguja }
  - { id: power_kw, unit: kW, kind: measured, range: [0, 2], noise_sd: 0.02, resolution: 0.01, description: Potencia eléctrica estimada del motor }
  - { id: accepting_infeed, unit: "", kind: status, description: 1 si hay capacidad libre en la cola de entrada }
events:
  - { id: garment_completed, description: Pieza terminada en el puesto }
  - { id: queue_full, description: Cola de entrada llena; se bloquea el abastecimiento }
  - { id: starved, description: Puesto sin trabajo disponible }
faults:
  - { id: thread_break, description: Rotura de hilo superior o de bobina; requiere re enhebrado, mtbf_h: 35, mttr_min: 2, severity: low, effect: "Parada y reproceso o inspección de la costura afectada" }
  - { id: needle_break, description: Aguja rota o doblada; cambio y revisión de puntada, mtbf_h: 120, mttr_min: 4, severity: medium, effect: "Parada del puesto y posible inspección de la pieza" }
commands:
  - { id: start, description: Habilita el puesto para coser }
  - { id: stop, description: Detiene el puesto al terminar la pieza actual }
  - { id: inject_fault, description: Inyecta una falla declarada, args: { fault: string, duration_s: number } }
  - { id: clear_fault, description: Repara una falla activa, args: { fault: string } }
kpis:
  - { id: utilization, unit: "", description: Fracción de tiempo con una pieza en costura }
  - { id: units_per_h, unit: u/h, description: Piezas terminadas por hora simulada }
  - { id: starved_pct, unit: "", description: Fracción de tiempo sin piezas para coser }
animation_channels:
  - { id: needle, range: [0, 1], description: Oscilación normalizada de la barra de aguja }
  - { id: handwheel, range: [0, 1], description: Giro acumulado del volante }
  - { id: operator_working, range: [0, 1], description: Postura de trabajo de la operaria }
  - { id: progress, range: [0, 1], description: Avance de costura de la pieza }
  - { id: stack_light, range: [0, 3], description: "Baliza: 0 apagada, 1 verde, 2 amarilla, 3 roja" }
geometry:
  parts: [table, head, needle_bar, presser_foot, handwheel, thread_spools, pedal, operator, stack_light, hmi]
assumptions:
  - "La referencia escogida por el usuario es una plana industrial de puntada recta; 5.500 puntadas/min es capacidad mecánica máxima de referencia, no ritmo productivo de prendas."
  - "El SAM cycle_s es el tiempo de contenido manual asignado al puesto; puntadas/min no se convierten directamente en prendas/min."
  - "Huella, potencia, fallas y cola son valores típicos supuestos; se deben ajustar al modelo y estudio real de tiempos."
references:
  - https://www.jacksew.com/juki-ddl-8700-high-speed-single-needle-straight-lockstitch-industrial-sewing-machine-with-table-and-servo-motor/
