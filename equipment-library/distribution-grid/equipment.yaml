schema_version: 0.1.0
type: distribution-grid
version: 0.1.0
name: Rejilla de distribución de un nivel
manufacturing: utility
category: utilities.water.distribution
description: >
  Un nivel de la red del acueducto a escala, que representa una comuna: un cabezal de 2" con cuatro
  ramales, cada ramal con cuatro válvulas de consumo (las casas) y dos válvulas de fuga (fraudes y
  pérdidas, en rojo) al final de los ramales 2 y 4, igual que las casas. Cada válvula descarga a una canaleta y mide su caudal y la presión
  aguas arriba. El reparto sale de la red hidráulica (twin_runtime.primitives.hydraulics): la presión de
  cada casa depende de lo que consumen todas las demás.
aliases: [rejilla, comuna, barrio, red de distribución, sector hidráulico, nivel de la red]
fidelity: { visual: V2, behavior: B2 }

params:
  level:               { type: integer, min: 1, max: 4, default: 1, description: Nivel de la rejilla en el edificio (1 abajo), affects: [geometry, display] }
  elevation_m:         { type: number, unit: m, min: 0, max: 50, default: 0, description: Elevación de la rejilla sobre el nivel 1, affects: [behavior] }
  spacing_m:           { type: number, unit: m, min: 0.2, max: 2, default: 0.5, description: Separación entre nodos del cabezal y entre válvulas de un ramal, affects: [geometry, behavior] }
  pipe_id_mm:          { type: number, unit: mm, min: 10, max: 300, default: 52.5, description: "Diámetro interior de cabezal y ramales (2\" SCH 40)", affects: [geometry, behavior] }
  consumer_kv_m3h:     { type: number, unit: m3/h, min: 0.001, max: 10, default: 0.12, description: Kv de cada válvula de consumo abierta del todo, affects: [behavior] }
  leak_kv_m3h:         { type: number, unit: m3/h, min: 0.001, max: 10, default: 0.12, description: Kv de cada válvula de fuga abierta del todo, affects: [behavior] }
  leak_exponent:       { type: number, min: 0.5, max: 2.5, default: 0.5, description: "Exponente de presión de las fugas (0,5 orificio; ≈ 1,15 fisuras en PVC)", affects: [behavior] }
  consumer_opening_pct: { type: number, unit: "%", min: 0, max: 100, default: 100, description: Apertura inicial de las válvulas de consumo, affects: [behavior] }
  leak_opening_pct:    { type: number, unit: "%", min: 0, max: 100, default: 100, description: Apertura inicial de las válvulas de fuga, affects: [behavior] }
  min_service_mca:     { type: number, unit: mca, min: 0, max: 100, default: 15, description: Presión mínima de servicio (alarma si alguna válvula queda por debajo), affects: [behavior] }
  critical_marker:     { type: boolean, default: false, description: "Marca la válvula c44 como la más crítica de la red", affects: [geometry] }
  consumer_color:      { type: string, default: "#2f6fb3", description: Color de las válvulas de consumo (hex), affects: [geometry] }
  leak_color:          { type: string, default: "#c62828", description: Color de las válvulas de fuga (hex), affects: [geometry] }
  bench_inlet_mca:     { type: number, unit: mca, min: 0, max: 300, default: 27.4, description: "Banco de prueba: presión a la entrada de la rejilla", affects: [behavior] }

ports:
  - { id: inlet, kind: material, direction: in, medium: agua, unit: m3/h }
  - { id: drain, kind: material, direction: out, medium: "agua a la canaleta (consumo y fugas)", unit: m3/h }

states:
  - { id: idle, description: Todas las válvulas cerradas }
  - { id: running, description: En servicio }
  - { id: fault, description: Detenida por falla }

variables:
  - { id: inlet_pressure_mca, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: Presión a la entrada de la rejilla }
  - { id: flow_in_m3h, unit: m3/h, kind: measured, range: [0, 500], noise_sd: 0.01, resolution: 0.001, description: Caudal que entra a la rejilla }
  - { id: consumption_m3h, unit: m3/h, kind: calculated, description: Suma de las válvulas de consumo }
  - { id: leakage_m3h, unit: m3/h, kind: calculated, description: Suma de las válvulas de fuga }
  - { id: leakage_pct, unit: "%", kind: calculated, description: Fugas ÷ caudal de entrada }
  - { id: min_pressure_mca, unit: mca, kind: calculated, description: Presión más baja entre las válvulas de consumo }
  - { id: min_pressure_valve, unit: "", kind: status, description: Válvula de consumo con la presión más baja }
  - { id: consumer_opening_pct, unit: "%", kind: setpoint, description: Apertura media de las válvulas de consumo }
  - { id: volume_m3, unit: m3, kind: counter, description: Volumen que entró a la rejilla }
  - { id: q_c11, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c11 (ramal 1, posición 1)" }
  - { id: p_c11, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula c11" }
  - { id: q_c12, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c12 (ramal 1, posición 2)" }
