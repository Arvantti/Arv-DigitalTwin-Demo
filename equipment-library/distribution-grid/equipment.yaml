  - { id: q_c31, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c31 (ramal 3, posición 1)" }
  - { id: p_c31, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula c31" }
  - { id: q_c32, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c32 (ramal 3, posición 2)" }
