  - { id: p_c33, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula c33" }
  - { id: q_c34, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c34 (ramal 3, posición 4)" }
