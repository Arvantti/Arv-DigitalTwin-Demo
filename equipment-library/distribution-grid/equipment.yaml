  - { id: p_c13, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula c13" }
  - { id: q_c14, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c14 (ramal 1, posición 4)" }
  - { id: p_c14, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula c14" }
  - { id: q_c21, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c21 (ramal 2, posición 1)" }
  - { id: p_c21, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula c21" }
  - { id: q_c22, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c22 (ramal 2, posición 2)" }
  - { id: p_c22, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula c22" }
  - { id: q_c23, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c23 (ramal 2, posición 3)" }
  - { id: p_c23, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula c23" }
  - { id: q_c24, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de consumo c24 (ramal 2, posición 4)" }
