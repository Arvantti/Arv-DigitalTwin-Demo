  - { id: p_l1, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula l1" }
  - { id: q_l2, unit: L/min, kind: measured, range: [0, 100], noise_sd: 0.02, resolution: 0.01, description: "Caudal de la válvula de fuga l2 (al final del ramal 4)" }
  - { id: p_l2, unit: mca, kind: measured, range: [0, 300], noise_sd: 0.02, resolution: 0.01, description: "Presión aguas arriba de la válvula l2" }

events:
  - { id: low_pressure, description: "Una válvula de consumo quedó bajo la presión mínima de servicio durante 30 s", payload: [valve, mca] }
  - { id: pressure_normal, description: Todas las válvulas de consumo volvieron sobre la presión mínima de servicio }
  - { id: opening_changed, description: Se ordenó una apertura nueva, payload: [valve, pct] }

faults:
  - { id: leak_burst, description: "Rotura o fraude grande en la fuga l1", mtbf_h: 2000, mttr_min: 120, severity: medium, stops_equipment: false, effect: "El Kv de la fuga l1 se multiplica por 5" }
  - { id: branch_blockage, description: Sedimento en la válvula del ramal 4, mtbf_h: 5000, mttr_min: 90, severity: low, stops_equipment: false, effect: "El Kv de la válvula del ramal 4 baja de 20 a 1 m³/h" }

commands:
  - { id: set_opening, description: "Ordena la apertura de una válvula (c11..c44, l1, l2) o de un grupo (consumers, leaks, all)", args: { valve: string, pct: number } }
  - { id: inject_fault, description: Inyecta una falla declarada, args: { fault: string, duration_s: number } }
  - { id: clear_fault, description: Repara una falla activa, args: { fault: string } }
  - { id: set_param, description: Cambia un parámetro en caliente, args: { name: string, value: any } }

kpis:
  - { id: consumption_m3, unit: m3, description: Volumen consumido }
  - { id: leakage_m3, unit: m3, description: Volumen perdido por fugas }
  - { id: nrw_pct, unit: "%", description: "Agua no contabilizada: fugas ÷ volumen de entrada" }
  - { id: min_pressure_mca, unit: mca, description: Presión mínima registrada después del primer minuto }

animation_channels:
  - { id: inlet_pressure_mca, unit: mca, range: [0, 300], description: Manómetro de entrada }
  - { id: min_pressure_mca, unit: mca, range: [0, 300], description: Presión mínima del nivel }
  - { id: flow_in_norm, range: [0, 2], description: "Caudal de entrada ÷ caudal de diseño del nivel (todas abiertas a 20 mca)" }
  - { id: open_c11, range: [0, 1], description: "Apertura de la válvula c11" }
  - { id: q_c11, unit: L/min, range: [0, 100], description: "Caudal de la válvula c11 (chorro hacia la canaleta)" }
  - { id: open_c12, range: [0, 1], description: "Apertura de la válvula c12" }
  - { id: q_c12, unit: L/min, range: [0, 100], description: "Caudal de la válvula c12 (chorro hacia la canaleta)" }
  - { id: open_c13, range: [0, 1], description: "Apertura de la válvula c13" }
  - { id: q_c13, unit: L/min, range: [0, 100], description: "Caudal de la válvula c13 (chorro hacia la canaleta)" }
  - { id: open_c14, range: [0, 1], description: "Apertura de la válvula c14" }
  - { id: q_c14, unit: L/min, range: [0, 100], description: "Caudal de la válvula c14 (chorro hacia la canaleta)" }
  - { id: open_c21, range: [0, 1], description: "Apertura de la válvula c21" }
  - { id: q_c21, unit: L/min, range: [0, 100], description: "Caudal de la válvula c21 (chorro hacia la canaleta)" }
  - { id: open_c22, range: [0, 1], description: "Apertura de la válvula c22" }
  - { id: q_c22, unit: L/min, range: [0, 100], description: "Caudal de la válvula c22 (chorro hacia la canaleta)" }
  - { id: open_c23, range: [0, 1], description: "Apertura de la válvula c23" }
  - { id: q_c23, unit: L/min, range: [0, 100], description: "Caudal de la válvula c23 (chorro hacia la canaleta)" }
  - { id: open_c24, range: [0, 1], description: "Apertura de la válvula c24" }
  - { id: q_c24, unit: L/min, range: [0, 100], description: "Caudal de la válvula c24 (chorro hacia la canaleta)" }
  - { id: open_c31, range: [0, 1], description: "Apertura de la válvula c31" }
  - { id: q_c31, unit: L/min, range: [0, 100], description: "Caudal de la válvula c31 (chorro hacia la canaleta)" }
  - { id: open_c32, range: [0, 1], description: "Apertura de la válvula c32" }
  - { id: q_c32, unit: L/min, range: [0, 100], description: "Caudal de la válvula c32 (chorro hacia la canaleta)" }
  - { id: open_c33, range: [0, 1], description: "Apertura de la válvula c33" }
  - { id: q_c33, unit: L/min, range: [0, 100], description: "Caudal de la válvula c33 (chorro hacia la canaleta)" }
  - { id: open_c34, range: [0, 1], description: "Apertura de la válvula c34" }
  - { id: q_c34, unit: L/min, range: [0, 100], description: "Caudal de la válvula c34 (chorro hacia la canaleta)" }
  - { id: open_c41, range: [0, 1], description: "Apertura de la válvula c41" }
  - { id: q_c41, unit: L/min, range: [0, 100], description: "Caudal de la válvula c41 (chorro hacia la canaleta)" }
  - { id: open_c42, range: [0, 1], description: "Apertura de la válvula c42" }
  - { id: q_c42, unit: L/min, range: [0, 100], description: "Caudal de la válvula c42 (chorro hacia la canaleta)" }
  - { id: open_c43, range: [0, 1], description: "Apertura de la válvula c43" }
  - { id: q_c43, unit: L/min, range: [0, 100], description: "Caudal de la válvula c43 (chorro hacia la canaleta)" }
  - { id: open_c44, range: [0, 1], description: "Apertura de la válvula c44" }
  - { id: q_c44, unit: L/min, range: [0, 100], description: "Caudal de la válvula c44 (chorro hacia la canaleta)" }
  - { id: open_l1, range: [0, 1], description: "Apertura de la válvula l1" }
  - { id: q_l1, unit: L/min, range: [0, 100], description: "Caudal de la válvula l1 (chorro hacia la canaleta)" }
  - { id: open_l2, range: [0, 1], description: "Apertura de la válvula l2" }
  - { id: q_l2, unit: L/min, range: [0, 100], description: "Caudal de la válvula l2 (chorro hacia la canaleta)" }

geometry:
  parts: [frame, header, branch_valves, branches, consumer_valves, leak_valves, gutter, inlet_riser, gauge, level_sign]

assumptions:
  - "Cabezal de 4 tramos y 4 ramales de 4 válvulas, todos de 2\" y separados spacing_m; las fugas cuelgan al final de los ramales 2 y 4, después de la cuarta casa, y descargan a la canaleta como las casas (docs/water-network-plant.md, supuesto S1)."
  - "Cada ramal empieza con una válvula de bola de 2\" (Kv 20 m³/h) que casi no pierde presión mientras está limpia."
  - "Tubos con Darcy-Weisbach (PVC) y pérdidas menores K = 0,3 por tramo de cabezal y 0,5 por tramo de ramal, como el predimensionamiento."
  - "Cada válvula descarga a la atmósfera: Q = Kv·apertura·(p/10,197)^β, con β 0,5 en consumos y leak_exponent en fugas."
  - "Fuera de una planta, la entrada es una presión fija (bench_inlet_mca); la entrada demand_factor escala la apertura de las válvulas de consumo (curva diaria)."
