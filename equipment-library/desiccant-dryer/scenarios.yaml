# Valores esperados calculados a mano. Tolva = throughput × residencia; el cargador mantiene el
# nivel entre 85 y 98 % (≈ 91,5 % en promedio). Humedad de una porción: 0,01 + (m0 − 0,01)·e^(−t/τ).
scenarios:
  - id: steady
    description: Secador de PS de 250 kg/h alimentando dos inyectoras de cubiertos (50 kg/h) durante 8 h
    preset: 250kg-ps
    duration_s: 28800
    inputs: { outflow_kg_h: 50 }
    expect:
      - { path: variables.resin_out_kg, min: 399, max: 401, description: "(50 kg/h × 8 h)" }
      - { path: variables.outlet_moisture_pct, max: 0.016, description: "(residencia ≈ 343 kg / 50 kg/h = 6,9 h ≫ τ = 0,4 h ⇒ ≈ 0,01 %)" }
      - { path: kpis.over_limit_pct, equals: 0.0 }
      - { path: kpis.kwh_per_kg, min: 0.16, max: 0.20, description: "(11 × (0,35 + 0,65 × 0,2) + 4,4 × 0,5 + 1,5 ≈ 9 kW / 50 kg/h = 0,18: a un 20 % de carga el secador gasta el triple que a plena carga, ≈ 0,06 kWh/kg)" }
      - { path: events.tower_switched, equals: 2, description: "(cada 4 h)" }

  - id: regeneration-failure
    description: Falla la regeneración del desecante en un secador de ABS a plena carga; el pellet sale húmedo
    preset: 150kg-abs
    duration_s: 21600
    inputs: { outflow_kg_h: 150 }
    timeline:
      - { at_s: 3600, command: inject_fault, args: { fault: regeneration_failure, duration_s: 18000 } }
    expect:
      # El rocío sube de −40 a +12 °C con τ = 1 h. La porción que sale a las 6 h entró a las ≈ 3,3 h
      # (residencia ≈ 412 / 150 = 2,74 h), con el rocío entre +6,5 y +11,7 °C: τ de secado
      # ≈ 0,8 × (1 + 50/10) ≈ 4,8 h ⇒ 0,01 + 0,29 × e^(−2,74/4,8) ≈ 0,17 %.
      - { path: variables.outlet_moisture_pct, min: 0.15, max: 0.20 }
      - { path: variables.dew_point_c, min: 10, description: "(5 h de falla: 12 − 52 × e^(−5) ≈ 11,7 °C)" }
      - { path: events.quality_alarm, min: 1 }

  - id: heater-failure
    description: El calentador de aire de proceso falla 45 min en el secador de PS a plena carga
    preset: 250kg-ps
    duration_s: 14400
    inputs: { outflow_kg_h: 250 }
    timeline:
      - { at_s: 1800, command: inject_fault, args: { fault: process_heater_failure, duration_s: 2700 } }
    expect:
      # Con el aire a ≈ 30 °C, τ = 0,4 × 2^(40/12) ≈ 4 h. Una porción pasa ≈ 0,75 h lenta y ≈ 0,6 h
      # normal de sus 1,37 h: 0,01 + 0,14 × e^(−0,19 − 1,3) ≈ 0,04 %, muy por debajo del límite.
      - { path: kpis.max_outlet_moisture_pct, min: 0.025, max: 0.07 }
      - { path: events.quality_alarm, equals: 0 }

  - id: loader-failure
    description: Falla el cargador 3 h; la tolva se vacía y al recargar sale pellet sin secar
    preset: 150kg-abs
    duration_s: 14400
    inputs: { outflow_kg_h: 150 }
    timeline:
      - { at_s: 600, command: inject_fault, args: { fault: loader_failure, duration_s: 10800 } }
    expect:
      # A los 600 s hay 405 − 25 = 380 kg: se vacía a los 600 + 380/150 h = 9.720 s y queda vacía
      # hasta 11.400 s (1.680 s sin material). Entregado: 150 × (14.400 − 1.680) / 3.600 = 530 kg.
      - { path: variables.resin_out_kg, min: 525, max: 535 }
      - { path: events.hopper_low, min: 1 }
      - { path: events.quality_alarm, min: 1, description: "(lo primero que entra a la tolva vacía sale casi sin secar)" }

  - id: demo
    description: Secador de ABS a 120 kg/h con fallas aleatorias (para la galería)
    preset: 150kg-abs
    duration_s: 28800
    inputs: { outflow_kg_h: 120 }
    random_faults: true
