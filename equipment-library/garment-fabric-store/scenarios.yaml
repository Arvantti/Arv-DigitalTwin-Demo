scenarios:
  - id: fifo-stock
    description: "Diez minutos: con una liberación por minuto se entregan 10 de los 12 rollos iniciales; la reposición media aporta 2,5 rollos y el crédito conserva la fracción"
    preset: standard
    duration_s: 600
    expect:
      - { path: variables.rolls_issued, min: 9, max: 10 }
      - { path: variables.rolls_on_hand, min: 3, max: 6 }
