scenarios:
  - id: steady
    description: Sachets de 250 ml a 100 u/min durante 10 minutos
    preset: sachet-250
    duration_s: 600
    expect:
      - { path: variables.delivered, min: 975, max: 980, description: "(100 u/min × (600 − 13,3 s de tránsito) ≈ 978)" }
      - { path: state, equals: running }

  - id: blocked-accumulation
    description: El control de peso deja de recibir; la banda acumula hasta llenarse y bloquea a la sachetadora
    preset: sachet-250
    duration_s: 120
    timeline:
      - { at_s: 30, inputs: { downstream_free: false } }
    expect:
      - { path: variables.items_on_belt, equals: 27, description: "(4 m / 0,15 m + 1)" }
      - { path: variables.accepting, equals: 0 }
      - { path: events.full, equals: 1 }
      - { path: state, equals: blocked }

  - id: unblock
    description: Se libera la salida y la banda drena la cola
    preset: sachet-250
    duration_s: 300
    timeline:
      - { at_s: 30, inputs: { downstream_free: false } }
      - { at_s: 120, inputs: { downstream_free: true } }
    expect:
      - { path: events.accepting_again, equals: 1 }
      - { path: variables.accepting, equals: 1 }

  - id: motor-trip
    description: Disparo del motor durante 10 minutos
    preset: sachet-1000
    duration_s: 1800
    timeline:
      - { at_s: 300, command: inject_fault, args: { fault: motor_trip, duration_s: 600 } }
    expect:
      - { path: events.fault_cleared, equals: 1 }
      - { path: kpis.throughput_upm, min: 15, max: 25, description: "(30 u/min, sin entregas ≈ 10 de 30 min)" }

  - id: bridge-steady
    description: Banda de maletas que sube a un puente de 4 m y baja (20 m en planta), 5 maletas por minuto durante 10 minutos
    preset: bhs-bridge-20m
    duration_s: 600
    expect:
      - { path: variables.max_slope_deg, min: 19.5, max: 20.3, description: "(las rampas de 16° no caben en 18 m: se empinan a 3,25 m en 9 m, atan 0,361 = 19,9°)" }
      - { path: variables.path_length_m, min: 21.0, max: 21.3, description: "(2 × √(9² + 3,25²) + 2 m a nivel = 21,14 m)" }
      - { path: variables.delivered, min: 45, max: 49, description: "(5 por min × (600 − 35 s de recorrido a 0,6 m/s) ≈ 47)" }
      - { path: variables.slipping, equals: 0, description: "(19,9° < atan 0,45 = 24,2°: las maletas suben con la banda)" }

  - id: steep-ramp-slip
    description: La misma banda con rampas de 35°, más empinadas que el ángulo de fricción de las maletas
    preset: bhs-bridge-20m
    params: { ramp_deg: 35 }
    duration_s: 300
    expect:
      - { path: events.slip, min: 1, description: "(tan 35° = 0,70 > 0,45: la primera maleta resbala al pie de la subida)" }
      - { path: variables.delivered, equals: 0 }
      - { path: variables.slipping, equals: 1 }
      - { path: variables.accepting, equals: 0, description: "(la maleta detenida tapa la entrada; las 4 plazas de espera se llenan)" }

  - id: queue-collisions
    description: La salida de una banda corta de maletas se bloquea al minuto; las que llegan chocan contra la cola
    preset: bhs-transfer-9m
    duration_s: 300
    timeline:
      - { at_s: 60, inputs: { downstream_free: false } }
    expect:
      - { path: variables.items_on_belt, equals: 8, description: "(9 m / 1,2 m + 1)" }
      - { path: variables.collisions, equals: 7, description: "(la primera se detiene en la descarga; cada una de las otras 7 llega a 0,6 m/s contra la cola)" }

  - id: queue-zone-control
    description: La misma banda con control por zonas (fotoceldas); al bloquearse la salida las maletas se acumulan sin chocar
    preset: bhs-transfer-9m
    params: { zone_control: true }
    duration_s: 300
    timeline:
      - { at_s: 60, inputs: { downstream_free: false } }
    expect:
      - { path: variables.items_on_belt, equals: 8, description: "(la misma capacidad: 9 m / 1,2 m + 1)" }
      - { path: variables.collisions, equals: 0, description: "(cada zona para antes de tocar a la de adelante)" }
      - { path: variables.zone_stopped, equals: 1 }
      - { path: variables.photo_eye, equals: 1 }
      - { path: state, equals: blocked }
