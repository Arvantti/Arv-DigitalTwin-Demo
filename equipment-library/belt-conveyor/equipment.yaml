schema_version: 0.1.0
type: belt-conveyor
version: 0.1.0
name: Banda transportadora
manufacturing: logistics
category: transport.conveyor
description: >
  Transportador de banda plana, malla, tablillas o rodillos que mueve unidades discretas
  (sachets, piezas, cajas, maletas) entre equipos. Acumula unidades cuando la salida se bloquea y deja
  de aceptar cuando se llena, propagando el bloqueo hacia la máquina anterior.
aliases: [banda, transportador, conveyor, banda de salida, transportador de rodillos]
fidelity: { visual: V2, behavior: B2 }

params:
  length_m:      { type: number, unit: m, min: 0.5, max: 200, default: 6, description: Largo útil, affects: [geometry, behavior] }
  width_m:       { type: number, unit: m, min: 0.1, max: 2, default: 0.4, description: Ancho de la banda, affects: [geometry] }
  speed_m_s:     { type: number, unit: m/s, min: 0.01, max: 3, default: 0.3, description: Velocidad de la banda, affects: [behavior] }
  pitch_m:       { type: number, unit: m, min: 0.02, max: 3, default: 0.25, description: Separación mínima entre unidades acumuladas, affects: [behavior, geometry] }
  height_m:      { type: number, unit: m, min: 0.2, max: 6, default: 0.85, description: Altura de la superficie de transporte, affects: [geometry] }
  kind:          { type: enum, values: [flat, mesh, slat, roller], default: flat, description: Tipo de transportador, affects: [geometry] }
  item:          { type: enum, values: [sachet, part, box, bag], default: sachet, description: Unidad que transporta (para el dibujo), affects: [geometry] }
  item_size_m:   { type: number, unit: m, min: 0.02, max: 1.5, default: 0.18, description: Tamaño de la unidad (para el dibujo), affects: [geometry] }
  item_color:    { type: string, default: "#c62828", description: Color de la unidad (hex), affects: [geometry] }
  nominal_inflow_upm: { type: number, unit: u/min, min: 0, max: 2000, default: 60, description: Llegada nominal de unidades si el entorno no la fija, affects: [behavior] }
  entry_buffer_units: { type: integer, min: 1, max: 64, default: 1, description: Unidades que caben en la zona de entrada esperando su turno (1 = llegadas una a una; más para máquinas que sueltan varias piezas por ciclo), affects: [behavior] }
  rise_m:        { type: number, unit: m, min: -6, max: 6, default: 0, description: "Diferencia de altura de la descarga respecto de la entrada (positiva sube, negativa baja)", affects: [geometry, behavior] }
  crest_height_m: { type: number, unit: m, min: 0, max: 8, default: 0, description: "Altura del tramo elevado intermedio (0 = sin tramo elevado): sube desde la entrada, sigue a nivel y baja a la descarga", affects: [geometry, behavior] }
  ramp_deg:      { type: number, unit: "°", min: 5, max: 35, default: 15, description: "Pendiente de las subidas y bajadas (se empina sola si el largo no alcanza)", affects: [geometry, behavior] }
  friction_coef: { type: number, min: 0.1, max: 1.0, default: 0.45, description: "Coeficiente de fricción entre la banda y la unidad: sube o baja con la banda mientras tan(pendiente) no lo supere", affects: [behavior] }
  motor_kw:      { type: number, unit: kW, min: 0.1, max: 30, default: 0.75, description: Potencia del motorreductor, affects: [geometry, behavior] }
  merge_at_m:    { type: number, unit: m, min: 0, max: 200, default: 0, description: "Punto de confluencia: a esta distancia de la entrada (en planta) entra de costado otra banda; 0 = sin confluencia", affects: [geometry] }
  merge_width_m: { type: number, unit: m, min: 0.2, max: 3, default: 1.2, description: Largo de la abertura en la guía lateral para la confluencia, affects: [geometry] }
  merge_side:    { type: enum, values: [left, right], default: left, description: "Lado de la confluencia mirando en el sentido de avance", affects: [geometry] }
  merge2_at_m:   { type: number, unit: m, min: 0, max: 200, default: 0, description: "Segunda confluencia: a esta distancia de la entrada entra de costado otra banda; 0 = sin segunda confluencia", affects: [geometry] }
  merge2_side:   { type: enum, values: [left, right], default: right, description: "Lado de la segunda confluencia mirando en el sentido de avance", affects: [geometry] }
  zone_control:  { type: boolean, default: false, description: "Control por zonas con fotoceldas: cada zona (del largo de una unidad) para si la de adelante está ocupada y arranca cuando se libera; las unidades se acumulan sin choques", affects: [geometry, behavior] }

ports:
  - { id: items_in, kind: item, direction: in, unit: u/min, link: { units: inflow_upm, ready: accepting } }
  - { id: items_out, kind: item, direction: out, unit: u/min, link: { units: delivered, ready: downstream_free } }
  - { id: power, kind: utility, direction: in, medium: energía eléctrica }

states:
  - { id: idle, description: Vacía y sin llegadas }
  - { id: running, description: Transportando }
  - { id: blocked, description: Unidades detenidas en la descarga porque la salida no recibe }
  - { id: fault, description: Detenida por falla }

variables:
  - { id: items_on_belt, unit: u, kind: calculated, description: Unidades sobre la banda }
  - { id: accumulated, unit: u, kind: calculated, description: Unidades detenidas en cola contra la descarga }
  - { id: delivered, unit: u, kind: counter, description: Unidades entregadas a la siguiente máquina }
  - { id: occupancy_pct, unit: "%", kind: calculated, range: [0, 100], description: Ocupación respecto de la capacidad de acumulación }
  - { id: accepting, unit: "", kind: status, description: "1 si acepta unidades, 0 si está llena (bloquea a la máquina anterior)" }
  - { id: collisions, unit: choques, kind: counter, description: "Unidades que alcanzaron a la de adelante con velocidad relativa (más de 0,05 m/s)" }
  - { id: slipping, unit: u, kind: calculated, description: Unidades detenidas al pie de una subida más empinada que su ángulo de fricción }
  - { id: photo_eye, unit: "", kind: status, description: "1 si la fotocelda de descarga ve una unidad" }
  - { id: zone_stopped, unit: "", kind: status, description: "1 si la fotocelda de descarga tiene detenida la zona de cabeza porque la salida no recibe" }
  - { id: path_length_m, unit: m, kind: calculated, description: Largo real del recorrido con subidas y bajadas }
  - { id: max_slope_deg, unit: "°", kind: calculated, description: Pendiente máxima del recorrido }
  - { id: speed_actual_m_s, unit: m/s, kind: measured, range: [0, 3], noise_sd: 0.002, resolution: 0.001, description: Velocidad real }
  - { id: motor_current_a, unit: A, kind: measured, range: [0, 100], noise_sd: 0.03, resolution: 0.01, description: Corriente del motor }

events:
  - { id: full, description: La banda se llenó y dejó de aceptar unidades }
  - { id: accepting_again, description: La banda vuelve a aceptar unidades }
  - { id: slip, description: Una unidad resbaló en una subida más empinada que su ángulo de fricción }

faults:
  - { id: motor_trip, description: Disparo térmico del motor, mtbf_h: 8000, mttr_min: 30, severity: medium, effect: La banda se detiene }
  - { id: belt_misalignment, description: Banda desalineada, mtbf_h: 2000, mttr_min: 20, severity: low, stops_equipment: false, effect: "Se reduce la velocidad al 70 % hasta el ajuste" }

commands:
  - { id: set_speed, description: Cambia la velocidad, args: { m_s: number } }
  - { id: inject_fault, description: Inyecta una falla declarada, args: { fault: string, duration_s: number } }
  - { id: clear_fault, description: Repara una falla activa, args: { fault: string } }
  - { id: set_param, description: Cambia un parámetro en caliente, args: { name: string, value: any } }

kpis:
  - { id: throughput_upm, unit: u/min, description: Unidades entregadas por minuto (promedio) }
  - { id: blocked_pct, unit: "", description: Fracción del tiempo bloqueada }
  - { id: collisions_per_h, unit: choques/h, description: Choques entre unidades por hora }

animation_channels:
  - { id: belt_travel, unit: m, range: [0, 10], description: Recorrido acumulado de la banda (módulo 10 m) }
  - { id: items_count, range: [0, 2000], description: Unidades sobre la banda }
  - { id: accumulated, range: [0, 2000], description: Unidades detenidas contra la descarga }
  - { id: eye_blocked, range: [0, 1], description: "1 si la fotocelda de descarga tiene detenida la zona de cabeza (haz en rojo)" }

geometry:
  parts: [frame, belt, rollers, side_guides, legs, drive_motor, items, photo_eye]

assumptions:
  - Las unidades entran por el inicio y avanzan a la velocidad de la banda; contra la descarga se acumulan a la separación mínima.
  - La corriente del motor crece con la carga transportada.
  - length_m es el largo en planta; cada unidad se sigue sobre el recorrido real (path_length_m), algo mayor con subidas y bajadas (≈ 3,5 % en una rampa de 15°).
  - Fricción, supuesto. con tan θ ≤ friction_coef la unidad va con la banda; en una subida más empinada resbala y se detiene al pie (bloquea a las de atrás); en una bajada más empinada se desliza a v × (1 + 4 × (tan θ − μ)), hasta el doble de la banda.
  - Choque = una unidad que alcanza la separación mínima con la de adelante con más de 0,05 m/s de diferencia; desde ahí avanza pegada a ella.
  - Con zone_control la banda va en zonas del largo de una unidad (acumulación sin presión); cada zona para antes de tocar a la de adelante, así que no se cuentan choques; la capacidad de acumulación es la misma.
