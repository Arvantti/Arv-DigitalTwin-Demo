[project]
name = "twin-runtime"
version = "0.1.0"
description = "Runtime de comportamiento de la librería de equipos: contrato, primitivas y simulación"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.20"]

[project.scripts]
twin-lib = "twin_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_runtime"]
