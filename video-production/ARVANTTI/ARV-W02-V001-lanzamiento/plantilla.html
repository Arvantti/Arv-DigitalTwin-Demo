<!doctype html>
<html lang="es" data-resolution="landscape">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Arvantti Digital Twin · lanzamiento</title>
<script src="assets/vendor/gsap.min.js"></script>
<style>
:root{--blue:#2d7ff9;--electric:#4ea7ff;--ti:#d8dadf;--dti:#7a7e86;--black:#05070c;--white:#f8fafc}
*{box-sizing:border-box}
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:var(--black);font-family:Inter,"Inter Display",Arial,sans-serif;color:var(--white)}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--black)}
.clip{position:absolute;inset:0}
.scene{overflow:hidden}
.w,.aw{display:inline-block;white-space:pre}

/* Fondo */
.fondo .glow{position:absolute;inset:-20%;background:radial-gradient(900px 520px at 50% 45%,#12305e55 0%,#05070c00 70%),radial-gradient(700px 400px at 80% 90%,#2d7ff922 0%,#05070c00 70%)}
.fondo .floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:62%;perspective:900px;opacity:.55;-webkit-mask-image:linear-gradient(#0000,#000 55%);mask-image:linear-gradient(#0000,#000 55%)}
.fondo .floorgrid{position:absolute;inset:0;transform:rotateX(68deg);transform-origin:50% 100%;background-image:linear-gradient(#4ea7ff33 2px,transparent 2px),linear-gradient(90deg,#4ea7ff33 2px,transparent 2px);background-size:120px 120px}

/* Estela de luz */
.estela{position:absolute;inset:0;width:1920px;height:1080px}
.estela path{fill:none;stroke:url(#gEst);stroke:#4ea7ff;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 10px #4ea7ff) drop-shadow(0 0 30px #2d7ff9)}
.q{position:absolute;left:0;right:0;top:400px;text-align:center;margin:0;font:800 150px/1 "Inter Display",Inter,sans-serif;letter-spacing:-3px}

/* Imagen a sangre */
.bleed{position:absolute;inset:0;overflow:hidden}
.bleed img{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;transform-origin:50% 50%}
.bleedv{object-fit:cover;width:1920px;height:1080px}
.bleed.dim img{filter:blur(10px) brightness(.25) saturate(.6)}
.vignette{position:absolute;inset:0;background:radial-gradient(1200px 700px at 50% 45%,#0000 40%,#05070ccc 100%),linear-gradient(#0000 60%,#05070cdd)}

/* Título */
.titulo{position:absolute;left:0;right:0;top:300px;text-align:center}
#e-titulo .vignette{background:radial-gradient(1000px 520px at 50% 50%,#05070caa 0%,#05070c55 60%,#05070cdd 100%)}
.titulo .marca{display:block;margin:0 auto 34px;width:220px;height:auto;filter:drop-shadow(0 0 30px #2d7ff988)}
.titulo h1,.fin h1{margin:10px 0 0;font:800 128px/1.05 "Inter Display",Inter,sans-serif;background:linear-gradient(100deg,#d8dadf 0%,#d8dadf 40%,#ffffff 50%,#d8dadf 60%,#d8dadf 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.titulo .t2{color:transparent}
.flare{position:absolute;top:-20%;bottom:-20%;left:30%;width:28%;background:linear-gradient(100deg,#0000 0%,#4ea7ff22 40%,#ffffff33 50%,#4ea7ff22 60%,#0000 100%);transform:skewX(-18deg);mix-blend-mode:screen}

/* Textos */
.kicker{margin:0 0 18px;font:600 26px "JetBrains Mono",monospace;letter-spacing:8px;color:var(--electric)}
.kicker b{display:inline-block;padding:4px 12px;margin-right:12px;border:2px solid var(--blue);color:#fff;font-weight:700;letter-spacing:2px}
.big{margin:0;font:800 92px/1.02 "Inter Display",Inter,sans-serif;letter-spacing:-2px}
.mid{margin:0;font:800 70px/1.05 "Inter Display",Inter,sans-serif;letter-spacing:-1.5px}
.center{position:absolute;left:0;right:0;top:440px;text-align:center;margin:0;font:800 96px/1.05 "Inter Display",Inter,sans-serif;letter-spacing:-2px}
.chip{display:inline-block;padding:12px 26px;margin:0 14px 14px 0;border:2px solid #4ea7ff66;border-radius:999px;background:#0d1a30cc;font:600 30px Inter,sans-serif;color:#e6eefc;box-shadow:0 0 24px #2d7ff933}
.chip.lg{font-size:34px;padding:14px 30px}

/* Planifica */
.col{position:absolute;left:110px;top:200px;width:620px}
.col .chips{margin-top:40px}
.verbs{list-style:none;padding:0;margin:34px 0 0;font:700 46px/1.5 "Inter Display",Inter,sans-serif;color:#5c6b80}
.verbs li{opacity:0}
.right{position:absolute;left:700px;top:150px;width:1180px;height:780px}
.stage3d{position:absolute;inset:0;perspective:2200px;perspective-origin:30% 50%}
.device{position:absolute;left:0;top:40px;width:1180px;height:664px;border-radius:20px;overflow:hidden;background:#0b1224;transform-style:preserve-3d;box-shadow:0 0 0 1.5px #4ea7ff66,0 40px 120px #000c,0 0 90px #2d7ff933}
.device .shot{position:absolute;inset:0;overflow:hidden;background:#0b1224}
.device .shot img{position:absolute;left:0;top:0;width:1180px;height:664px;object-fit:cover;object-position:top left;transform-origin:50% 40%}
.device video.shot{width:1180px;height:664px;object-fit:cover;object-position:top left}
.device .edge{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 18px #4ea7ff,0 0 50px #2d7ff9;opacity:0;z-index:5}
.device .sheen{position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,#0000,#ffffff26 50%,#0000);z-index:6;transform:translateX(-100%)}
.reflect{position:absolute;left:4%;right:4%;top:730px;height:60px;background:radial-gradient(ellipse at 50% 0,#2d7ff944,#0000 70%);filter:blur(10px)}

/* Gemelo */
.hud{position:absolute;inset:40px;pointer-events:none}
.hud .c{position:absolute;width:70px;height:70px;border:3px solid #4ea7ffcc}
.hud .tl{left:0;top:0;border-right:0;border-bottom:0}.hud .tr{right:0;top:0;border-left:0;border-bottom:0}
.hud .bl{left:0;bottom:0;border-right:0;border-top:0}.hud .br{right:0;bottom:0;border-left:0;border-top:0}
.hud .scan{position:absolute;left:0;right:0;top:0;height:90px;background:linear-gradient(#4ea7ff00,#4ea7ff22,#4ea7ff00)}
.hud .live{position:absolute;right:30px;top:24px;margin:0;font:600 22px "JetBrains Mono",monospace;letter-spacing:5px;color:#9fd0ff}
.hud .scrub{position:absolute;left:100px;right:100px;bottom:30px;height:4px;background:#ffffff22}
.hud .scrub i{position:absolute;inset:0;background:linear-gradient(90deg,#2d7ff9,#4ea7ff);transform-origin:left;box-shadow:0 0 14px #4ea7ff}
.lowerleft{position:absolute;left:110px;bottom:140px}
.lowerleft .big{font-size:120px}
.label{position:absolute;left:110px;bottom:130px;margin:0;font:800 84px "Inter Display",Inter,sans-serif;letter-spacing:-1px;text-shadow:0 4px 40px #000;opacity:0}
.play{position:absolute;left:860px;top:440px;width:200px;height:200px;opacity:0}
.play svg{width:200px;height:200px}
.play circle{fill:#05070c88;stroke:#4ea7ff;stroke-width:3}
.play path{fill:#fff}
.b1,.b2,.b3,.b4,.b5{opacity:0}

/* Control */
.top{position:absolute;left:110px;top:70px}
.wide{position:absolute;left:110px;top:270px;width:1180px;height:760px}
.wide .stage3d{perspective-origin:50% 0%}
.right3{position:absolute;left:1360px;top:420px;width:460px}
.right3 .chip{display:block;width:fit-content}

/* Fractal */
.topl{position:absolute;left:110px;top:70px}
.fan{position:absolute;inset:0;perspective:2000px;transform-style:preserve-3d}
.card{position:absolute;left:660px;top:330px;width:600px;height:400px;border-radius:16px;overflow:hidden;background:#0b1224;box-shadow:0 0 0 1.5px #4ea7ff55,0 30px 80px #000b;opacity:0}
.card img{width:600px;height:338px;object-fit:cover;object-position:top left}
.card .score{position:absolute;left:0;right:0;bottom:0;height:62px;background:#08101f;display:flex;align-items:center;padding:0 22px;gap:16px}
.card .score i{flex:1;height:10px;background:linear-gradient(90deg,#2d7ff9,#4ea7ff);transform-origin:left;border-radius:6px}
.card .score b{font:700 30px "JetBrains Mono",monospace;color:#fff}
.tags{position:absolute;left:0;right:0;top:820px;text-align:center}
.decide{position:absolute;left:0;right:0;bottom:0;padding:200px 0 110px;text-align:center;opacity:0;background:linear-gradient(#05070c00,#05070cee 55%)}
.decide p{margin:0 0 26px;font:800 84px "Inter Display",Inter,sans-serif;text-shadow:0 4px 40px #000}
.decide button{font:700 30px "JetBrains Mono",monospace;letter-spacing:6px;color:#fff;background:var(--blue);border:0;border-radius:999px;padding:22px 54px;box-shadow:0 0 0 0 #4ea7ff88,0 0 40px #2d7ff988}

/* Asistente */
.chat{position:absolute;left:410px;top:230px;width:1100px;height:640px;border-radius:28px;background:linear-gradient(160deg,#101c33ee,#0a1222ee);box-shadow:0 0 0 1.5px #4ea7ff55,0 40px 120px #000c,0 0 120px #2d7ff922;padding:34px 44px}
.chat .bar{display:flex;align-items:center;gap:16px;font:700 32px Inter,sans-serif;color:#fff;padding-bottom:26px;border-bottom:1px solid #4ea7ff33}
.chat .dot{width:16px;height:16px;border-radius:50%;background:#37e38b;box-shadow:0 0 14px #37e38b}
.chat .badge{margin-left:auto;font:600 22px "JetBrains Mono",monospace;letter-spacing:2px;color:#9fd0ff;border:1.5px solid #4ea7ff66;border-radius:999px;padding:8px 18px}
.msg{margin-top:34px;max-width:820px;padding:24px 30px;border-radius:22px;font:500 38px/1.35 Inter,sans-serif}
.msg.me{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:6px;width:fit-content}
.msg.ai{background:#16243f;color:#e6eefc;border-bottom-left-radius:6px}
.wave{position:absolute;left:44px;right:44px;bottom:34px;height:70px;display:flex;align-items:center;justify-content:center;gap:9px}
.wave i{display:block;width:8px;height:calc(var(--h)*70px);border-radius:4px;background:linear-gradient(#4ea7ff,#2d7ff9);transform-origin:50% 50%}

/* Conecta */
.net{position:absolute;inset:0;width:1920px;height:1080px}
.net line{stroke:#4ea7ff;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px #4ea7ff)}
.net .pk{fill:#fff;filter:drop-shadow(0 0 8px #4ea7ff);opacity:0}
.node{position:absolute;width:220px;height:84px;border-radius:14px;background:#0d1a30;border:2px solid #4ea7ff88;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 30px Inter,sans-serif;box-shadow:0 0 30px #2d7ff933}
.node small{font:500 18px "JetBrains Mono",monospace;letter-spacing:3px;color:#9fd0ff}
.node.erp{width:240px;height:120px;font-size:40px}
.proto{position:absolute;font:700 26px "JetBrains Mono",monospace;letter-spacing:5px;color:#9fd0ff}
.core{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(#13284d,#0a1222);border:3px solid var(--electric);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 80px #2d7ff966,inset 0 0 60px #2d7ff944}
.core img{width:130px;height:auto}
.core span{font:700 30px Inter,sans-serif}
.bottomc{position:absolute;left:0;right:0;bottom:90px;margin:0;text-align:center;font:800 84px "Inter Display",Inter,sans-serif}

/* Planes */
.hx,.hx2{position:absolute;left:0;right:0;top:56px;margin:0;text-align:center;font:800 64px "Inter Display",Inter,sans-serif;letter-spacing:-1px}
.hx2 .sinu{display:block;margin-top:6px;font:600 38px Inter,sans-serif;letter-spacing:0;color:var(--electric);opacity:0}
.hepta{position:absolute;inset:0;width:1920px;height:1080px}
.hepta polygon{fill:#2d7ff90d;stroke:#4ea7ff;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 10px #2d7ff9)}
.hepta line{stroke:#4ea7ff88;stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1}
.hcore{position:absolute;width:300px;height:300px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#123063,#0a1426 70%);box-shadow:0 0 0 2px #4ea7ff99,0 0 80px #2d7ff966;opacity:0;z-index:2}
.hcore img{width:92px;margin-bottom:6px}
.hcore b{font:800 40px "Inter Display",Inter,sans-serif;line-height:1}
.hcore span{font:600 30px Inter,sans-serif;color:var(--electric)}
.hcore small{margin-top:8px;font:500 19px "JetBrains Mono",monospace;color:#9fb3cf;letter-spacing:1px}
.mod{position:absolute;width:340px;height:104px;box-sizing:border-box;padding:14px 18px 0 78px;border:2px solid #4ea7ff55;border-radius:18px;background:#0d1a30ee;opacity:0;z-index:2}
.mod i{position:absolute;left:16px;top:24px;width:48px;height:48px;border-radius:50%;border:2px solid var(--blue);font:700 26px/44px "JetBrains Mono",monospace;font-style:normal;text-align:center;color:#fff}
.mod p{margin:0;font:700 34px Inter,sans-serif;color:#fff;white-space:nowrap}
.mod small{display:block;margin-top:2px;font:500 21px Inter,sans-serif;color:#9fb3cf;white-space:nowrap}

/* Cierre */
.fin{position:absolute;left:0;right:0;top:250px;text-align:center}
.fin .marca{display:block;margin:0 auto 20px;width:260px;height:auto;filter:drop-shadow(0 0 40px #2d7ff9aa)}
.fin h1{font-size:110px}
.fin h1 span{color:transparent}
.fin .firma{margin:28px 0 0;font:600 52px Inter,sans-serif;color:#fff}
.fin .url{margin:40px 0 0;font:500 28px "JetBrains Mono",monospace;letter-spacing:6px;color:#7a9cc6}

.sweep{background:linear-gradient(100deg,#0000 35%,#4ea7ff18 45%,#ffffff40 50%,#4ea7ff18 55%,#0000 65%);mix-blend-mode:screen;pointer-events:none}
#temp{left:auto;top:auto;right:20px;bottom:16px;font:700 15px "JetBrains Mono",monospace;color:#ff6b35;letter-spacing:2px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080" data-fps="25">
{{CLIPS}}
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
{{TIMELINE}}
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
