name: Deploy

# Publica la galería web (equipos, escena de planta y panel del acueducto) en
# Cloudflare Pages en cada push a main y cada lunes (la programación de producción publicada va de 35 días atrás
# a 45 adelante; el despliegue semanal la mantiene al día). Guía de configuración: docs/despliegue-cloudflare.md

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"  # lunes 05:00 en Colombia

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: digitaltwin-arvantti

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verificar secretos de Cloudflare
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID; no se despliega. Ver docs/despliegue-cloudflare.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Exportar el plano de las plantas (la escena 3D lo pide a /api/plants)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          uv sync
          uv run python tools/deploy/export_static_plants.py
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm gallery:build
      - name: Desplegar en Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Crea el proyecto la primera vez (si ya existe, el comando falla y se ignora).
          pnpm dlx wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main || true
          pnpm dlx wrangler@4 pages deploy apps/gallery/dist --project-name="$PAGES_PROJECT" --branch=main
