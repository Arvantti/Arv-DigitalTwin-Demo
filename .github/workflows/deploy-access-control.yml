name: Deploy access control API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then echo "Missing required GitHub secret: $name" >&2; exit 1; fi
          done
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and typecheck access control
        run: |
          pnpm --filter @twin/access-core test
          pnpm --filter @twin/access-control-api typecheck
          pnpm --filter @twin/access-control-api test
      - name: Apply pending D1 migrations
        run: pnpm --filter @twin/access-control-api exec wrangler d1 migrations apply digitaltwin-access-control --remote --config ../../wrangler.access-control.jsonc
      - name: Deploy access control Worker
        run: pnpm --filter @twin/access-control-api run deploy
