[project]
name = "industrial-twin"
version = "0.1.0"
description = "Gemelo digital industrial: librería de equipos, runtime de simulación y API"
requires-python = ">=3.11"
dependencies = ["twin-runtime", "twin-emulator-api"]

[tool.uv.workspace]
members = ["packages/twin-runtime", "apps/twin-emulator-api"]

[tool.uv.sources]
twin-runtime = { workspace = true }
twin-emulator-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
city = ["eclipse-sumo>=1.28"]  # gemelo de ciudad (docs/ciudad.md): uv sync --group city

[tool.pytest.ini_options]
testpaths = ["packages/twin-runtime/tests", "equipment-library", "apps/twin-emulator-api/tests", "tools/city/tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
