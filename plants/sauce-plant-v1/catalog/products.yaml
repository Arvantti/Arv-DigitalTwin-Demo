# Productos de la planta de salsas (docs/datos-reales.md): SKU = receta × presentación. Tres semielaborados a granel
# (uno por familia, con su receta) y seis SKU en sachet, los que corren hoy en los escenarios de simulation.yaml.
# Las líneas caliente y fría hacen varias recetas (BBQ y picante; light y rosada) con reglas de orden en
# catalog/changeovers.yaml (sequence). Cada SKU usa su granel en kg por sachet (presentación × densidad de la llenadora), laminado y 1/n de caja.
# Las llenadoras que admiten otro formato (500 y 1.000 ml) aparecen como alternativas; la activa es la que tiene
# el formato montado (setup.yaml). El grupo de alérgenos va en el granel (allergen_group) y el SKU lo hereda por su
# lista de materiales. La ruta es la habitual de cada SKU; que las llenadoras de 250 ml en frío (01 y 03) también
# llenen el otro producto con CIP por alérgeno lo decide el APS (aps/aps.yaml, multipurpose), no el secuenciador de
# referencia. Datos supuestos.
products:
- id: salsa-tomate
  name: Salsa de tomate pasteurizada
  family: caliente
  allergen_group: sin-alergenos
  kind: semi
  unit: kg
  color: '#c62828'
  routing:
  - stage: pesaje
    equipment: [scale-01]
  - stage: cocción
    equipment: [kettle-01, kettle-02, kettle-03]
    tooling: rcp-tomato-sauce
  - stage: pasteurización
    equipment: [pasteurizer-01, pasteurizer-02]
  - stage: pulmón caliente
    equipment: [buffer-hot-01, buffer-hot-02]
  assumed: true
